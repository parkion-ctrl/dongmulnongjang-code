  a.setAttribute('aria-label', '이렇게 대답해요');
  form.append(q, a, el('button', 'cook-btn', '가르치기'));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const qq = q.value.trim(), aa = a.value.trim();
    if (!qq || !aa) return toast('두 칸을 다 채워 주세요');
    if (hasBadWord(qq) || hasBadWord(aa)) return toast('그런 말은 배우기 싫대요. 고운 말을 가르쳐 주세요');
    pet.taught = [{ q: qq, a: aa }, ...(pet.taught || []).filter(t => t.q !== qq)].slice(0, 30);
    finishSchool({
      title: '말을 배웠어요!', gain: { love: 15, know: 10 }, fatigue: 10, effort: 2,
      line: aa,
      extra: [`이제 '${qq}'라고 말하면 '${aa}'라고 대답해요.`],
    });
  });
  root.append(form);
  if ((pet.taught || []).length) {
    root.append(el('h3', 'sub-title', '가르친 말'));
    const ul = el('div', 'taught-list');
    pet.taught.forEach(t => ul.append(el('div', null, `"${t.q}" → "${t.a}"`)));

  }
}

let dexView = 'animals';
function renderDex() {
  const root = $('screen-dex');
  root.replaceChildren();
  const seg = el('div', 'seg');
  [['animals', '동물수첩'], ['companions', `동료 ${S.companions.length}`]].forEach(([id, label]) => {
    const b = el('button', null, label);
    b.setAttribute('aria-pressed', String(dexView === id));
    b.addEventListener('click', () => { dexView = id; renderDex(); });
    seg.append(b);
  });
  root.append(seg);
  if (dexView === 'companions') return renderCompanions(root);

  const found = ANIMALS.filter(a => (S.dex[a.slug] || {}).seen >= 0).length;
  root.append(el('h2', 'section-title', '동물수첩'));
  root.lastChild.append(el('span', null, `${found} / ${ANIMALS.length} 만남`));
  const grid = el('div', 'grid');
  ANIMALS.forEach(a => {
    const d = S.dex[a.slug] || { seen: -1, ended: 0, bestScore: 0 };
    const t = el('button', 'tile' + (d.seen < 0 ? ' locked' : ''));
    const img = el('img');
    img.src = sprite(a.slug, Math.max(0, d.seen));
    img.alt = '';
    img.loading = 'lazy';
    t.append(img, el('span', null, d.seen < 0 ? '???' : a.name));
    if (companionOf(a.slug)) t.append(el('span', 'done', '동료'));
    t.addEventListener('click', () => {
      if (d.seen < 0) return toast('아직 만나지 못한 동물이에요');
      openModal(box => {
        box.append(el('h3', null, a.name));
        const st = el('div', 'stages');
        STAGE_NAMES.forEach((n, i) => {
          const f = el('figure');
          const img2 = el('img', i > d.seen ? 'locked' : null);
          img2.src = sprite(a.slug, i);
          img2.alt = i > d.seen ? '' : `${a.name} ${n}`;
          f.append(img2, el('figcaption', null, i > d.seen ? '???' : n));
          st.append(f);
        });
        box.append(st);
        if (d.ended) box.append(el('p', null, `엔딩 ${d.ended}회 · 최고 점수 ${d.bestScore}`));
        const ok = el('button', 'btn', '닫기');
        ok.addEventListener('click', closeModal);
        box.append(ok);

    grid.append(t);
  });

}

function renderCompanions(root) {
  root.append(el('h2', 'section-title', '탐험 파티'));
  root.lastChild.append(el('span', null, `최대 ${PARTY_SIZE}명`));
  const slots = el('div', 'party');
  for (let i = 0; i < PARTY_SIZE; i++) {
    const c = companionOf(S.party[i]);
    const slot = el('div', 'slot' + (c ? '' : ' empty'));
    if (c) {
      const img = el('img');
      img.src = sprite(c.slug, 2);
      img.alt = '';
      slot.append(img, el('span', null, c.name));
    } else {
      slot.append(el('span', null, '빈 자리'));
    }

  root.append(el('h2', 'section-title', '동료 목록'));

    root.append(el('p', 'note', '아직 동료가 없어요. 동물을 키워 엔딩을 보면 사람이 되어 동료로 합류해요.'));
    return;
  }
  const list = el('div', 'roster');
  S.companions.forEach(c => {

    const b = el('button', 'mate' + (inParty ? ' in' : ''));
    b.setAttribute('aria-pressed', String(inParty));
    const img = el('img');

    info.append(top, el('div', 'pet-kind', `${ANIMAL_BY_SLUG[c.slug].name} · ${c.score}점`));
    const st = el('div', 'mate-stats');
    STATS.forEach(s => st.append(el('span', null, `${s.name} ${c.stats[s.k]}`)));

}

// 동료의 전투 능력(원작 환산 + 장비)
function fighter(c) {
  const g = c.gear || {};
  const run = S.tower.run;
  // 유령의 장난으로 봉인된 장비는 이번 탐험이 끝날 때까지 효과 없음
  const sealed = run && run.sealed ? run.sealed.filter(x => x.slug === c.slug).map(x => x.kind) : [];
  const w = sealed.includes('weapon') ? null : EX_ITEMS[g.weapon];
  const sh = sealed.includes('shield') ? null : EX_ITEMS[g.shield];
  const k = cursed() ? run.debuff.ratio : 1;
  return {
    atk: Math.round((Math.round(c.stats.love / 10) + (w ? w.atk : 0)) * k),
    def: Math.round((Math.round(c.stats.charm / 10) + (sh ? sh.def : 0)) * k),
    hp: c.stats.power, mp: c.stats.know, mag: Math.round(c.stats.know / 10 * k),
  };
}
// 저주(능력치 감소)가 지금 층에 걸려 있는지

  const run = S.tower.run;
  return !!(run && run.debuff && run.floor > run.debuff.from && run.floor <= run.debuff.until);

// ----- 탑 오르기 -----
function startRun(from) {
  const members = {};
  partyMates().forEach(c => { const f = fighter(c); members[c.slug] = { hp: f.hp, mp: f.mp }; });
  S.tower.run = { floor: from, members, loot: { points: 0, items: {} }, room: null, foe: null, turn: 0, log: [] };
  enterFloor();
}

function rollRoom(floor, not) {
  const pool = Object.entries(ROOMS).filter(([id, rm]) => id !== not && (!rm.from || floor >= rm.from));
  let n = Math.random() * pool.reduce((a, [, rm]) => a + rm.w, 0);
  for (const [id, rm] of pool) { n -= rm.w; if (n < 0) return id; }
  return 'battle';
}

function enterFloor() {
  const r = S.tower.run;
  r.turn = 0;
  r.log = [];
  r.result = null;
  r.title = null;
  r.foes = null;
  r.guest = null;
  r.helpResult = null;
  if (r.floor === TOWER_TOP && !S.tower.doorOpen) {
    r.room = 'door';
    r.scene = 'hall';
  } else if (r.floor === 1 || r.floor % TOWER_SAVE_EVERY === 0) {
    openRoom('battle');
    return;
  } else {
    // 갈림길: 서로 다른 방 두 개, 가끔 문 뒤가 안 보임
    const a = rollRoom(r.floor);
    r.room = 'fork';
    r.scene = 'fork';
    r.doors = [a, rollRoom(r.floor, a)].map(id => ({ id, hidden: Math.random() < HIDDEN_DOOR }));
  }
  save();
  renderExplore();
  document.querySelector('.app > main').scrollTop = 0;
}

function openRoom(id) {
  const r = S.tower.run;
  r.doors = null;
  r.puzzle = null;
  r.log = [];
  r.room = id;
  r.scene = ROOM_SCENE[id];
  if (id === 'battle' || id === 'elite') {
    const foe = floorFoe(r.floor);
    if (id === 'elite') {
      Object.assign(foe, { name: '성난 ' + foe.name, elite: true,
        atk: Math.round(foe.atk * ELITE.atk), def: Math.round(foe.def * ELITE.def), hp: Math.round(foe.hp * ELITE.hp) });
      foe.maxHp = foe.hp;
    }
    r.room = 'battle';
    r.foes = [foe];
    r.target = 0;
    S.tower.seen[foe.id] = true;
    r.log = [`${josa(foe.name, '이', '가')} 나타났다!`];
  } else if (id === 'quiz') {
    r.quiz = Math.floor(Math.random() * NONSENSE.length);
  } else if (id === 'spring') {
    liveMembers().forEach(({ f, st }) => {
      st.hp = Math.min(f.hp, st.hp + Math.round(f.hp * 0.3));
      st.mp = Math.min(f.mp, st.mp + Math.round(f.mp * 0.3));
    });
    return clearRoom(['맑은 샘물을 마시고 체력과 마력을 조금 되찾았어요. (최대치의 30%)']);
  } else if (id === 'lost') {
    const pool = ANIMALS.filter(a => !S.party.includes(a.slug));
    r.guest = { slug: pick(pool).slug, ask: pick(Object.keys(HELP)) };
  }
  save();
  renderExplore();
  document.querySelector('.app > main').scrollTop = 0;
}

// 전투가 아닌 방을 마치고 다음 층으로 갈 수 있는 상태로
function clearRoom(lines, title) {
  const r = S.tower.run;
  r.title = title || null;
  Object.values(r.members).forEach(st => { if (st.hp < 0) st.hp = 0; });
  if (!liveMembers().length) return wipeOut();
  S.tower.best = Math.max(S.tower.best, r.floor);
  r.log = lines;
  r.room = 'cleared';
  r.result = '위층으로 올라갈까요?';
  save();
  renderExplore();
}

// 함정·상자 피해: 살아 있는 동료 모두 최대 체력의 일정 비율(쓰러지지는 않음)
function hurtAll(ratio) {
  liveMembers().forEach(({ f, st }) => { st.hp = Math.max(1, st.hp - Math.round(f.hp * ratio)); });
}

// 보물상자 자물쇠 퍼즐 3종(무작위). 시간 제한·실패 없음, 포기하면 그냥 지나감.
// 상태는 세이브(r.puzzle)에 들어가므로 앱을 껐다 켜도 이어서 풀 수 있다.
const PUZZLES = {
  pipe: { name: '길 잇기', rule: '타일을 눌러 돌려서 왼쪽 입구부터 오른쪽 자물쇠까지 빛의 길을 이어요.' },
  lights: { name: '보석 밝히기', rule: '보석을 누르면 그 보석과 위아래·양옆 보석이 함께 켜지고 꺼져요. 모두 켜요.' },
  dials: { name: '연동 원판', rule: '원판을 누르면 그 원판과 아래 색 칩에 적힌 원판이 함께 한 칸씩 돌아요. 화살표를 모두 별(위)로 맞춰요.' },
};
// 벽/연결 비트: 1=위 2=오른쪽 4=아래 8=왼쪽. 시계 방향으로 90도 돌리기
const rotMask = (m, k) => { for (let i = 0; i < (k % 4 + 4) % 4; i++) m = ((m << 1) | (m >> 3)) & 15; return m; };
const PIPE_DIRS = [[0, -1, 1, 4], [1, 0, 2, 8], [0, 1, 4, 1], [-1, 0, 8, 2]];

function makePuzzle(floor) {
  const type = pick(Object.keys(PUZZLES));
  if (type === 'pipe') {
    const n = floor < 10 ? 4 : floor < 20 ? 5 : 6;
    // 입구(왼쪽 sr행)에서 출구(오른쪽 er행)까지 무작위 길을 판다
    const sr = Math.floor(Math.random() * n), er = Math.floor(Math.random() * n);
    let path = null;
    for (let tries = 0; !path && tries < 200; tries++) {
      const seen = new Set([sr * n]);
      const walk = [[0, sr]];
      const dfs = () => {
        const [x, y] = walk[walk.length - 1];
        if (x === n - 1 && y === er) return walk.length >= n + 1;
        const order = PIPE_DIRS.slice().sort(() => Math.random() - 0.5);
        for (const [dx, dy] of order) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= n || ny >= n || seen.has(ny * n + nx)) continue;
          seen.add(ny * n + nx); walk.push([nx, ny]);
          if (dfs()) return true;
          walk.pop(); seen.delete(ny * n + nx);
        }
        return false;
      };
      if (dfs()) path = walk.map(([x, y]) => y * n + x);
    }
    const base = Array(n * n).fill(0);
    path.forEach((c, i) => {
      const x = c % n, y = Math.floor(c / n);
      let m = 0;
      [path[i - 1], path[i + 1]].forEach(o => {
        if (o == null) return;
        const ox = o % n, oy = Math.floor(o / n);
        m |= ox > x ? 2 : ox < x ? 8 : oy > y ? 4 : 1;
      });
      if (i === 0) m |= 8;
      if (i === path.length - 1) m |= 2;
      base[c] = m;
    });
    for (let c = 0; c < n * n; c++) if (!base[c]) base[c] = rotMask(pick([5, 3, 7, 3, 5]), Math.floor(Math.random() * 4));
    const puz = { type, n, sr, er, base, rot: base.map(() => 0), path };
    do { puz.rot = base.map(() => 1 + Math.floor(Math.random() * 3)); } while (puzzleSolved(puz));
    return puz;
  }
  if (type === 'lights') {
    const n = floor < 10 ? 3 : floor < 20 ? 4 : 5;
    const puz = { type, n, on: Array(n * n).fill(1) };
    // 다 켜진 상태에서 무작위로 눌러 섞으므로 항상 풀 수 있다
    do {
      const presses = new Set();
      while (presses.size < Math.ceil(n * n / 3) + Math.floor(Math.random() * 2)) presses.add(Math.floor(Math.random() * n * n));
      puz.on = Array(n * n).fill(1);
      presses.forEach(c => toggleLights(puz, c));
    } while (puzzleSolved(puz));
    return puz;
  }
  // dials: 원판마다 '함께 도는 원판' 하나. 돌리기는 더하기라 순서와 상관없이 섞어도 항상 풀 수 있다
  // 10층 미만 3개, 20층 미만 4개, 그 위로 5개. 원판마다 다른 원판 하나가 같이 돈다
  const n = floor < 10 ? 3 : floor < 20 ? 4 : 5;
  const many = 1;
  const link = Array.from({ length: n }, (_, i) => {
    const others = [...Array(n).keys()].filter(j => j !== i).sort(() => Math.random() - 0.5);
    return others.slice(0, many).sort((a, b) => a - b);
  });
  const puz = { type, n, link, pos: Array(n).fill(0) };
  do {
    puz.pos = Array(n).fill(0);
    for (let k = 0; k < n * 2; k++) turnDial(puz, Math.floor(Math.random() * n), -1);
  } while (puzzleSolved(puz));
  return puz;
}

function toggleLights(puz, c) {
  const n = puz.n, x = c % n, y = Math.floor(c / n);
  [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
    const nx = x + dx, ny = y + dy;
    if (nx >= 0 && ny >= 0 && nx < n && ny < n) puz.on[ny * n + nx] ^= 1;
  });
}
// 원판 i 를 누르면 같이 도는 원판들(예전 세이브는 숫자 하나)
const dialLinks = (puz, i) => [].concat(puz.link[i]);
function turnDial(puz, i, dir = 1) {
  [i, ...dialLinks(puz, i)].forEach(k => { puz.pos[k] = (puz.pos[k] + dir + 6) % 6; });
}
// 길 잇기: 입구에서 이어진 칸들
function pipeLit(puz) {
  const { n, sr } = puz;
  const tile = c => rotMask(puz.base[c], puz.rot[c]);
  const lit = new Set();
  const start = sr * n;
  if (!(tile(start) & 8)) return lit;
  const q = [start];
  lit.add(start);
  while (q.length) {
    const c = q.shift(), x = c % n, y = Math.floor(c / n), m = tile(c);
    PIPE_DIRS.forEach(([dx, dy, bit, back]) => {
      const nx = x + dx, ny = y + dy, ni = ny * n + nx;
      if (!(m & bit) || nx < 0 || ny < 0 || nx >= n || ny >= n || lit.has(ni)) return;
      if (tile(ni) & back) { lit.add(ni); q.push(ni); }
    });
  }
  return lit;
}
function puzzleSolved(puz) {
  if (puz.type === 'pipe') {
    const exit = puz.er * puz.n + puz.n - 1;
    return pipeLit(puz).has(exit) && !!(rotMask(puz.base[exit], puz.rot[exit]) & 2);
  }
  if (puz.type === 'lights') return puz.on.every(Boolean);
  return puz.pos.every(v => v === 0);
}

// 상자에 손을 대면 20%는 함정 상자: 퍼즐 없이 독가스로 체력만 깎임
const CHEST_TRAP = { chance: 0.2, hurt: 0.15 };

function startChestPuzzle() {
  const r = S.tower.run;
  if (Math.random() < CHEST_TRAP.chance) {
    hurtAll(CHEST_TRAP.hurt);
    return clearRoom([`자물쇠를 만지자 독가스가 뿜어져 나왔어요! 모두 체력이 ${Math.round(CHEST_TRAP.hurt * 100)}% 줄었어요.`, '함정 상자였나 봐요…'], '함정 상자!');
  }
  r.puzzle = makePuzzle(r.floor);
  r.log = [];
  save();
  renderExplore();
}

// 연동 원판: 원판마다 색을 달리하고, 3개는 한 줄, 4개는 2×2, 5개는 3+2줄
const DIAL_COLORS = ['#ff6b8b', '#4fb3ff', '#6fdc6f', '#ffb340', '#c38bff'];
function dialLayout(n) {
  if (n <= 3) return { W: 600, H: 330, R: 86, centers: Array.from({ length: n }, (_, i) => [600 * (i + 0.5) / n, 118]) };
  if (n === 4) return { W: 600, H: 620, R: 94, centers: [[150, 118], [450, 118], [150, 420], [450, 420]] };
  return { W: 600, H: 620, R: 86, centers: [[100, 118], [300, 118], [500, 118], [200, 420], [400, 420]] };
}
const puzzleCanvasHeight = puz => (puz.type === 'dials' ? dialLayout(puz.n).H : 600);
// 원판이 돌아가는 모습(표시용 각도, 칸 단위로 누적)
let dialAnim = null;

function drawPuzzle() {
  const cv = document.getElementById('puzzle-canvas');
  const puz = S.tower.run && S.tower.run.puzzle;
  if (!cv || !puz) return;
  const g = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#1b0c40';
  g.fillRect(0, 0, W, H);
  const gold = '#ffd75e', dim = '#7d6ba8';
  if (puz.type === 'pipe') {
    const { n } = puz, pad = 30, cs = (W - pad * 2) / n;
    const lit = pipeLit(puz);
    for (let c = 0; c < n * n; c++) {
      const x = pad + (c % n) * cs, y = pad + Math.floor(c / n) * cs, m = rotMask(puz.base[c], puz.rot[c]);
      g.fillStyle = '#2e1868';
      g.fillRect(x + 3, y + 3, cs - 6, cs - 6);
      g.strokeStyle = lit.has(c) ? gold : dim;
      g.lineWidth = cs * 0.2;
      g.lineCap = 'round';
      const cx = x + cs / 2, cy = y + cs / 2;
      g.beginPath();
      if (m & 1) { g.moveTo(cx, cy); g.lineTo(cx, y); }
      if (m & 2) { g.moveTo(cx, cy); g.lineTo(x + cs, cy); }
      if (m & 4) { g.moveTo(cx, cy); g.lineTo(cx, y + cs); }
      if (m & 8) { g.moveTo(cx, cy); g.lineTo(x, cy); }
      g.stroke();
    }
    // 입구(빛)와 출구(자물쇠)
    const ey = pad + (puz.sr + 0.5) * cs, xy = pad + (puz.er + 0.5) * cs;
    g.fillStyle = gold;
    g.beginPath(); g.arc(pad / 2, ey, pad * 0.42, 0, Math.PI * 2); g.fill();
    g.fillStyle = puzzleSolved(puz) ? gold : '#c94f7c';
    g.fillRect(W - pad + 3, xy - pad * 0.4, pad - 8, pad * 0.8);
  } else if (puz.type === 'lights') {
    const { n } = puz, pad = 24, cs = (W - pad * 2) / n;
    puz.on.forEach((v, c) => {
      const cx = pad + (c % n + 0.5) * cs, cy = pad + (Math.floor(c / n) + 0.5) * cs, rr = cs * 0.36;
      if (v) {
        const gr = g.createRadialGradient(cx, cy, rr * 0.2, cx, cy, rr * 1.4);
        gr.addColorStop(0, '#fff6c2'); gr.addColorStop(0.5, gold); gr.addColorStop(1, 'rgba(255,215,94,0)');
        g.fillStyle = gr;
        g.beginPath(); g.arc(cx, cy, rr * 1.4, 0, Math.PI * 2); g.fill();
      }
      g.fillStyle = v ? gold : '#3b2675';
      g.strokeStyle = v ? '#fff3b0' : dim;
      g.lineWidth = 4;
      g.beginPath();
      g.moveTo(cx, cy - rr); g.lineTo(cx + rr, cy); g.lineTo(cx, cy + rr); g.lineTo(cx - rr, cy); g.closePath();
      g.fill(); g.stroke();
    });
  } else {
    drawDials(g, puz);
  }
}

function drawDials(g, puz) {
  const { R, centers } = dialLayout(puz.n);
  if (!dialAnim || dialAnim.puz !== puz) dialAnim = { puz, shown: puz.pos.slice(), target: puz.pos.slice(), raf: 0 };
  const chip = (x, y, i, r) => {
    g.fillStyle = DIAL_COLORS[i];
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#1b0c40';
    g.font = `bold ${Math.round(r * 1.1)}px sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(i + 1), x, y + 1);
  };
  centers.forEach(([cx, cy], i) => {
    const col = DIAL_COLORS[i], done = puz.pos[i] === 0;
    // 판
    g.fillStyle = done ? '#3a2a10' : '#2e1868';
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    g.lineWidth = 12;
    g.strokeStyle = done ? '#ffd75e' : col;
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
    // 눈금 6개, 맨 위는 목표(별)
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 3, px = cx + Math.cos(a) * R * 0.74, py = cy + Math.sin(a) * R * 0.74;
      if (k === 0) {
        g.fillStyle = '#ffd75e';
        g.beginPath();
        for (let t = 0; t < 10; t++) {
          const rr = t % 2 ? R * 0.09 : R * 0.2, aa = -Math.PI / 2 + t * Math.PI / 5;
          g.lineTo(px + Math.cos(aa) * rr, py + Math.sin(aa) * rr);
        }
        g.closePath(); g.fill();
      } else {
        g.fillStyle = 'rgba(233,222,252,.55)';
        g.beginPath(); g.arc(px, py, R * 0.06, 0, Math.PI * 2); g.fill();
      }
    }
    // 화살표(돌아가는 중이면 중간 각도)
    const a = -Math.PI / 2 + dialAnim.shown[i] * Math.PI / 3, L = R * 0.6;
    const tx = cx + Math.cos(a) * L, ty = cy + Math.sin(a) * L;
    g.lineCap = 'round';
    g.strokeStyle = '#ffffff';
    g.lineWidth = 16;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(tx, ty); g.stroke();
    g.strokeStyle = done ? '#ffd75e' : col;
    g.lineWidth = 10;
    g.beginPath(); g.moveTo(cx, cy); g.lineTo(tx, ty); g.stroke();
    g.fillStyle = done ? '#ffd75e' : col;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * (L + R * 0.2), cy + Math.sin(a) * (L + R * 0.2));
    g.lineTo(tx + Math.cos(a + Math.PI / 2) * R * 0.15, ty + Math.sin(a + Math.PI / 2) * R * 0.15);
    g.lineTo(tx + Math.cos(a - Math.PI / 2) * R * 0.15, ty + Math.sin(a - Math.PI / 2) * R * 0.15);
    g.closePath(); g.fill();
    chip(cx, cy, i, R * 0.17);
    // 누르면 같이 도는 원판: [자기] + [이어진 원판]
    g.fillStyle = '#cdb8f2';
    g.font = `${Math.round(R * 0.25)}px sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('누르면', cx, cy + R + 32);
    const y3 = cy + R + 68;
    const group = [i, ...dialLinks(puz, i)], gap = R * 0.6;
    group.forEach((k, j) => {
      const x = cx + (j - (group.length - 1) / 2) * gap;
      chip(x, y3, k, R * 0.19);
      if (j) {
        g.fillStyle = '#e9defc';
        g.font = `bold ${Math.round(R * 0.3)}px sans-serif`;
        g.fillText('+', x - gap / 2, y3);
      }
    });
  });
}

function animateDials() {
  if (!dialAnim) return;
  const step = () => {
    let moving = false;
    dialAnim.shown = dialAnim.shown.map((v, i) => {
      const d = dialAnim.target[i] - v;
      if (Math.abs(d) < 0.02) return dialAnim.target[i];
      moving = true;
      return v + d * 0.28;
    });
    drawPuzzle();
    dialAnim.raf = moving ? requestAnimationFrame(step) : 0;
  };
  cancelAnimationFrame(dialAnim.raf);
  if (FX_REDUCED) { dialAnim.shown = dialAnim.target.slice(); drawPuzzle(); } else step();
}

function tapPuzzle(e) {
  const r = S.tower.run, puz = r && r.puzzle;
  if (!puz || puz.done) return; // 풀린 뒤 상자가 열리기 전까지 더 누른 건 무시(보상 중복 방지)
  const cv = e.currentTarget, rect = cv.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width * cv.width, y = (e.clientY - rect.top) / rect.height * cv.height;
  if (puz.type === 'pipe' || puz.type === 'lights') {
    const pad = puz.type === 'pipe' ? 30 : 24, cs = (cv.width - pad * 2) / puz.n;
    const cx = Math.floor((x - pad) / cs), cy = Math.floor((y - pad) / cs);
    if (cx < 0 || cy < 0 || cx >= puz.n || cy >= puz.n) return;
    const c = cy * puz.n + cx;
    if (puz.type === 'pipe') puz.rot[c] = (puz.rot[c] + 1) % 4; else toggleLights(puz, c);
  } else {
    const { R, centers } = dialLayout(puz.n);
    const i = centers.findIndex(([cx, cy]) => Math.hypot(x - cx, y - cy) <= R * 1.25);
    if (i < 0) return;
    turnDial(puz, i);
    // 표시 각도는 늘 앞으로(시계 방향) 돌아가게 누적
    if (dialAnim && dialAnim.puz === puz) {
      [i, ...dialLinks(puz, i)].forEach(k => { dialAnim.target[k] += 1; });
      save();
      animateDials();
      if (puzzleSolved(puz)) { puz.done = true; save(); setTimeout(openChest, FX_REDUCED ? 0 : 450); }
      return;
    }
  }
  save();
  drawPuzzle();
  if (puzzleSolved(puz)) {
    puz.done = true;
    save();
    setTimeout(openChest, FX_REDUCED ? 0 : 350);
  }
}

function openChest() {
  const r = S.tower.run;
  if (!r || !r.puzzle) return;
  r.puzzle = null;
  const pts = 30 + r.floor * 4;
  r.loot.points += pts;
  const lines = ['찰칵! 자물쇠가 풀렸어요.', `상자 안에서 ${pts}P를 찾았어요!`];
  if (Math.random() < 0.7) {
    const item = pick(['game_shealingpotion', 'game_shealingpotion', 'game_healingpotion', 'game_magicpotion']);
    addItems(r.loot.items, { [item]: 1 });
    lines.push(`${EX_ITEMS[item].name}도 들어 있었어요.`);
  }
  if (r.floor >= 15 && Math.random() < 0.15) {
    addItems(r.loot.items, { gold_bar: 1 });
    lines.push('반짝! 황금덩어리도 있었어요.');
  }
  clearRoom(lines, '보물상자 열림!');
}

function passTrap(stat) {
  const live = liveMembers();
  const avg = live.reduce((a, { c }) => a + c.stats[stat], 0) / live.length;
  const ok = Math.random() < Math.min(0.9, avg / (avg + 300));
  if (ok) {
    const pts = 10 + S.tower.run.floor * 2;
    S.tower.run.loot.points += pts;
    return clearRoom([stat === 'know' ? '바닥의 이상한 무늬를 피해 무사히 지나갔어요.' : '함정이 작동하기 전에 재빨리 빠져나갔어요!', `지나가다 떨어진 동전을 주웠어요. +${pts}P`]);
  }
  hurtAll(0.2);
  clearRoom([stat === 'know' ? '앗, 숨겨진 발판을 밟았어요! 화살이 쏟아졌어요.' : '달리다 바닥이 꺼졌어요! 아래로 굴러떨어졌다가 겨우 올라왔어요.', '모두 체력이 20% 줄었어요.']);
}

function buyFromWanderer(id) {
  const it = EX_ITEMS[id];
  if (S.points < it.price) return toast('포인트가 모자라요');
  S.points -= it.price;
  S.goodsBag[id] = (S.goodsBag[id] || 0) + 1;
  renderPoints();
  save();
  toast(`${josa(it.name, '을', '를')} 샀어요`);
  renderExplore();
}

function doorCard(d, i) {
  const rm = ROOMS[d.id];
  const b = el('button', 'ex-door' + (d.hidden ? ' hidden-door' : ''));
  b.append(el('span', 'ex-door-no', i ? '오른쪽 문' : '왼쪽 문'));
  b.append(el('strong', null, d.hidden ? '???' : rm.name));
  b.append(el('small', null, d.hidden ? '문 너머가 조용해요…' : rm.hint));
  b.addEventListener('click', () => openRoom(d.id));
  return b;
}

function renderTowerRun(root) {
  const r = S.tower.run;
  if (r.room === 'battle' && r.foes && !fxBusy) {
    if (!r.foes.some(f => f.hp > 0)) return winFloor(r.log.slice());
    if (!liveMembers().length) return wipeOut();
  }
  const bar = el('div', 'ex-floorbar');
  bar.append(el('strong', null, `북쪽 탑 ${r.floor}층`), el('span', null, `모은 것 ${r.loot.points}P${Object.keys(r.loot.items).length ? ' · 아이템 ' + Object.values(r.loot.items).reduce((a, b) => a + b, 0) + '개' : ''}`));
  root.append(bar);
  const status = [];
  if (cursed()) status.push(`유령의 저주: 능력치 -${Math.round((1 - r.debuff.ratio) * 100)}% (${r.debuff.until}층까지)`);
  (r.sealed || []).forEach(x => {
    const c = companionOf(x.slug);
    const id = c && (c.gear || {})[x.kind];

  });
  if (status.length) {
    const st = el('div', 'ex-status');
    status.forEach(t => st.append(el('span', null, t)));

  const stage = el('div', 'ex-stage');
  stage.id = 'ex-stage';
  if (r.scene) {
    stage.classList.add('scene');
    stage.style.backgroundImage = `linear-gradient(rgba(27,12,64,.15),rgba(27,12,64,.55)),url(${asset(`assets/explore/room_${r.scene}.jpg`)})`;
  }
  root.append(stage);
  if (r.foe && !r.foes) { r.foes = [r.foe]; delete r.foe; } // 이전 버전 세이브
  if (r.room === 'battle' && r.foes) {
    const foeSrc = foe => asset(`assets/explore/${foe.img.includes('.') ? foe.img : foe.img === 'ex_07' ? 'mage.png' : foe.img + '.gif'}`);
    if (r.foes.length === 1) {
      const foe = r.foes[0];

      const wrap = el('div', 'ex-foe-wrap' + (foe.hp <= 0 ? ' dead' : ''));

      img.alt = foe.name;
      wrap.append(img);
      stage.append(wrap);
      stage.append(hpBar(foe.hp, foe.maxHp, 'foe', 'foe-0'));
      stage.append(el('div', 'ex-foe-stat', `공격 ${foe.atk} · 방어 ${foe.def}`));
    } else {
      // 여러 마리: 눌러서 공격할 대상을 고른다
      stage.append(el('div', 'ex-foe-name', '몬스터 무리'));
      const row = el('div', 'ex-foe-row');

        const b = el('button', 'ex-foe-card' + (foe.hp <= 0 ? ' dead' : '') + (foe === tgt ? ' target' : ''));
        const img = el('img', 'ex-foe small');
        img.src = foeSrc(foe);
        img.alt = foe.name;
        b.dataset.fx = 'foe-' + i;
        b.append(img, el('small', null, foe.name), hpBar(foe.hp, foe.maxHp, 'foe', 'foe-' + i));
        b.disabled = foe.hp <= 0;
        b.addEventListener('click', () => { r.target = i; save(); renderExplore(); });
        row.append(b);
      });

  } else if (r.room === 'lost' && r.guest) {

  }

  const party = el('div', 'ex-run-party');
  partyMates().forEach(c => {
    const st = r.members[c.slug];
    if (!st) return;
    const f = fighter(c);
    const m = el('div', 'ex-run-mate' + (st.hp <= 0 ? ' down' : ''));
    const img = el('img');
    img.src = sprite(c.slug, 2);
    img.alt = '';
    m.dataset.fx = 'mate-' + c.slug;
    m.append(img, el('small', null, c.name), hpBar(st.hp, f.hp, 'hp', 'hp-' + c.slug), hpBar(st.mp, f.mp, 'mp', 'mp-' + c.slug));
    party.append(m);
  });
  // 미로 중에는 화살표가 미로 바로 밑에 오도록 파티·기록을 숨긴다
  const boardRoom = r.room === 'maze' || (r.room === 'chest' && r.puzzle);
  if (!boardRoom) root.append(party);

  if (r.log.length && !boardRoom) {
    const log = el('div', 'ex-log');
    r.log.forEach(line => log.append(el('div', null, line)));
    root.append(log);
  }

  const cmds = el('div', 'ex-cmds');
  cmds.id = 'ex-cmds';
  if (r.room === 'battle') {
    const live = liveMembers();
    const canMagic = live.some(x => x.st.mp >= MAGIC_COST);
    [['attack', '공격하기', '무기로 공격'], ['guard', '방어하기', '받는 피해를 줄여요'], ['magic', '마법공격', `불 마법 · 마력 ${MAGIC_COST}`], ['item', '아이템', '물약 쓰기']].forEach(([id, label, sub]) => {
      const b = el('button', 'ex-cmd ex-cmd-' + id);
      b.append(el('strong', null, label), el('small', null, sub));
      if (id === 'magic') b.disabled = !canMagic;
      b.addEventListener('click', () => (id === 'item' ? openPotions() : towerTurn(id)));
      cmds.append(b);
    });
  } else if (r.room === 'lost' && r.guest) {
    const h = HELP[r.guest.ask];
    const yes = el('button', 'ex-btn', h.accept);
    if (r.guest.ask === 'supply') {
      const has = POTION_ORDER.find(id => bagCount(id) > 0);
      yes.disabled = !has;
      if (!has) yes.textContent = '줄 수 있는 물약이 없어요';
    }
    yes.addEventListener('click', acceptHelp);
    const no = el('button', 'ex-btn ghost', '미안하지만 지나가기');
    no.addEventListener('click', () => clearRoom([`${ANIMAL_BY_SLUG[r.guest.slug].name} 아이를 두고 지나갔어요…`]));
    cmds.append(yes, no);
    cmds.classList.add('one');
  } else if (r.room === 'maze') {
    const pad = el('div', 'ex-pad');
    [['up', '▲', 0, -1], ['left', '◀', -1, 0], ['right', '▶', 1, 0], ['down', '▼', 0, 1]].forEach(([cls, t, dx, dy]) => {
      const b = el('button', 'ex-pad-' + cls, t);
      b.setAttribute('aria-label', { up: '위로', left: '왼쪽으로', right: '오른쪽으로', down: '아래로' }[cls]);
      b.addEventListener('click', () => moveMaze(dx, dy));
      pad.append(b);
    });
    cmds.append(pad);
    cmds.classList.add('one');
  } else if (r.room === 'fork') {
    r.doors.forEach((d, i) => cmds.append(doorCard(d, i)));
  } else if (r.room === 'chest') {
    if (!r.puzzle) {
      const open = el('button', 'ex-btn', '자물쇠 풀기');
      open.addEventListener('click', startChestPuzzle);
      cmds.append(open);
    }
    const skip = el('button', 'ex-btn ghost', r.puzzle ? '포기하고 지나가기' : '그냥 지나가기');
    skip.addEventListener('click', () => { r.puzzle = null; clearRoom(['상자를 두고 조용히 지나갔어요.']); });
    cmds.append(skip);
    cmds.classList.add('one');
  } else if (r.room === 'trap') {
    const live = liveMembers();
    TRAP_OPTIONS.forEach(([stat, label, statName]) => {
      const avg = Math.round(live.reduce((a, { c }) => a + c.stats[stat], 0) / live.length);
      const b = el('button', 'ex-btn ' + (stat === 'know' ? '' : 'ghost'));
      b.append(document.createTextNode(label), el('small', 'ex-btn-sub', `파티 평균 ${statName} ${avg} · 성공률 ${Math.round(Math.min(0.9, avg / (avg + 300)) * 100)}%`));
      b.addEventListener('click', () => passTrap(stat));
      cmds.append(b);
    });
    cmds.classList.add('one');
  } else if (r.room === 'merchant') {
    const grid = el('div', 'food-grid');
    ['game_shealingpotion', 'game_healingpotion', 'game_magicpotion'].forEach(id => {
      const it = EX_ITEMS[id];
      const card = el('div', 'food-card');
      const im = el('img');
      im.src = exImg(id);
      im.alt = '';
      const btn = el('button', null, `${it.price}P`);
      btn.disabled = S.points < it.price;
      btn.addEventListener('click', () => buyFromWanderer(id));
      card.append(im, el('strong', null, it.name), el('small', null, `가진 것 ${bagCount(id)}`), btn);
      grid.append(card);
    });
    const done = el('button', 'ex-btn', '인사하고 지나가기');
    done.addEventListener('click', () => clearRoom(['“또 보세나, 이히히.” 상인이 어둠 속으로 사라졌어요.']));
    cmds.append(grid, done);
    cmds.classList.add('one');
  } else if (r.room === 'quiz') {
    NONSENSE[r.quiz][1].forEach((ans, i) => {
      const b = el('button', 'quiz-opt', ans);
      b.addEventListener('click', () => answerQuiz(i));
      cmds.append(b);
    });
    cmds.classList.add('one');
  } else if (r.room === 'door') {
    const input = el('input', 'name-input');
    input.placeholder = '주문을 입력해요';
    input.maxLength = 20;
    const b = el('button', 'ex-btn', '주문 외우기');
    b.addEventListener('click', () => {
      if (input.value.replace(/\s/g, '') === DOOR_SPELL) {
        S.tower.doorOpen = true;
        toast('문이 열렸어요!');
        enterFloor();
      } else toast('아무 일도 일어나지 않았어요…');
    });
    cmds.append(input, b);
    cmds.classList.add('one');
  } else if (r.room === 'cleared') {
    if (r.floor % TOWER_SAVE_EVERY === 0) {
      const sv = el('button', 'ex-btn', r.floor === TOWER_TOP ? '저장하고 탑을 나가기' : '저장하기 (체력·마력 회복)');
      sv.addEventListener('click', saveTower);
      cmds.append(sv);
    }
    if (r.floor < TOWER_TOP) {
      const nx = el('button', r.floor % TOWER_SAVE_EVERY === 0 ? 'ex-btn ghost' : 'ex-btn', `${r.floor + 1}층으로 올라가기`);
      nx.addEventListener('click', () => { r.floor += 1; enterFloor(); });
      cmds.append(nx);
    }
    cmds.classList.add('one');
  }
  root.append(cmds);
  if (r.room === 'maze') {
    if (!maze) startMaze(true);
    drawMaze();
  }
  if (r.room === 'chest' && r.puzzle) {
    drawPuzzle();
    if (r.puzzle.done) setTimeout(openChest, 0);
  }
  const leave = el('button', 'link-btn ex-leave', '탑에서 나가기');
  leave.addEventListener('click', confirmLeave);
  root.append(leave);
}

function hpBar(v, max, kind, key) {
  const w = el('div', 'ex-bar ' + kind);
  if (key) { w.dataset.bar = key; w.dataset.max = max; }
  const b = el('b');
  b.style.width = `${Math.max(0, Math.min(100, v / Math.max(1, max) * 100))}%`;
  w.append(b, el('span', null, kind === 'foe' ? `${Math.max(0, v)} / ${max}` : String(Math.max(0, v))));
  return w;
}

// 지금 공격할 몬스터: 고른 대상이 살아 있으면 그것, 아니면 살아 있는 첫 번째
function battleTarget() {
  const r = S.tower.run;
  const t = r.foes[r.target];
  return t && t.hp > 0 ? t : r.foes.find(f => f.hp > 0);
}

function towerTurn(cmd) {
  if (fxBusy) return;
  const r = S.tower.run;
  const lines = [];
  const fx = [];
  const before = snapshotBars();
  const live = liveMembers();
  if (cmd === 'guard') {
    lines.push('모두 방어 자세를 취했어요.');
    fx.push({ t: 'guard' });
  } else {
    live.forEach(({ c, f, st }) => {
      const foe = battleTarget();
      if (!foe) return;
      const fi = r.foes.indexOf(foe);
      let dmg;
      const magic = cmd === 'magic' && st.mp >= MAGIC_COST;
      if (magic) {
        st.mp -= MAGIC_COST;
        dmg = roll(f.mag * 2);
        lines.push(`${c.name}의 불 마법! ${dmg}`);
      } else {
        dmg = hitDamage(f.atk, foe.def);
        lines.push(`${c.name}의 공격! ${dmg}`);
      }
      foe.hp = Math.max(0, foe.hp - dmg);
      fx.push({ t: magic ? 'fire' : 'slash', slug: c.slug, foe: fi, dmg, hp: foe.hp, mp: magic ? st.mp : null, kill: foe.hp <= 0 });
      if (foe.hp <= 0 && r.foes.length > 1) lines.push(`${josa(foe.name, '을', '를')} 쓰러뜨렸어요!`);
    });
  }
  const won = !r.foes.some(f => f.hp > 0);
  if (!won) {
    r.turn += 1;
    const guard = cmd === 'guard' ? GUARD_TAKEN : 1;
    r.foes.forEach((foe, fi) => {
      if (foe.hp <= 0) return;
      const now = liveMembers();
      if (!now.length) return;
      if (foe.boss && r.turn % BOSS_SWEEP_EVERY === 0) {
        lines.push(`${foe.name}의 전체 공격!`);
        const hits = now.map(({ c, f, st }) => {
          const d = Math.max(1, Math.round(hitDamage(foe.atk, f.def) * 0.6 * guard));
          st.hp = Math.max(0, st.hp - d);
          lines.push(`${c.name} -${d}`);
          return { slug: c.slug, dmg: d, hp: st.hp };
        });
        fx.push({ t: 'sweep', foe: fi, hits });
      } else {
        const t = pick(now);
        const d = Math.max(1, Math.round(hitDamage(foe.atk, t.f.def) * guard));
        t.st.hp = Math.max(0, t.st.hp - d);
        lines.push(`${foe.name}의 공격! ${t.c.name} -${d}`);
        fx.push({ t: 'bite', foe: fi, hits: [{ slug: t.c.slug, dmg: d, hp: t.st.hp }] });
      }
    });
  }
  r.log = lines;
  save();
  const wiped = !won && !liveMembers().length;
  fxBusy = true;
  renderExplore();
  playFx(before, fx, () => {
    fxBusy = false;
    if (won) return winFloor(lines);
    if (wiped) return wipeOut();
    renderExplore();
  });
}

// ----- 전투 효과 -----
let fxBusy = false;
const FX_REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fxWait = ms => new Promise(res => setTimeout(res, FX_REDUCED ? Math.min(ms, 60) : ms));

// 턴 시작 전 막대 값(효과가 끝날 때까지 이 값에서 줄어드는 모습을 보여 준다)
function snapshotBars() {
  const r = S.tower.run;
  const v = {};
  (r.foes || []).forEach((f, i) => { v['foe-' + i] = f.hp; });
  Object.entries(r.members).forEach(([slug, st]) => { v['hp-' + slug] = st.hp; v['mp-' + slug] = st.mp; });
  return v;
}

function setBar(key, value) {
  const w = document.querySelector(`[data-bar="${key}"]`);
  if (!w) return;
  const max = +w.dataset.max || 1;
  w.querySelector('b').style.width = `${Math.max(0, Math.min(100, value / max * 100))}%`;
  w.querySelector('span').textContent = w.classList.contains('foe') ? `${Math.max(0, value)} / ${max}` : String(Math.max(0, value));
}

function fxNode(key) { return document.querySelector(`[data-fx="${key}"]`); }

function popNumber(target, text, cls) {
  if (!target) return;
  const n = el('span', 'fx-num ' + (cls || ''), text);
  n.style.left = `${35 + Math.random() * 30}%`;
  target.append(n);
  setTimeout(() => n.remove(), 900);
}

function burst(target, cls, ms = 450) {
  if (!target) return;
  const b = el('span', 'fx-burst ' + cls);
  target.append(b);
  setTimeout(() => b.remove(), ms);
}

function shake(node, cls = 'fx-shake') {
  if (!node) return;
  node.classList.remove(cls);
  void node.offsetWidth;
  node.classList.add(cls);
  setTimeout(() => node.classList.remove(cls), 420);
}

async function playFx(before, fx, done) {
  const cmds = document.getElementById('ex-cmds');
  if (cmds) cmds.classList.add('busy');
  // 화면은 이미 결과 값으로 그려졌으니, 막대·쓰러짐 표시를 턴 시작 전으로 되돌려 놓고 시작
  Object.entries(before).forEach(([k, v]) => setBar(k, v));
  // 이번 턴에 쓰러진 것만 '쓰러짐' 표시를 잠시 되돌린다(이미 쓰러져 있던 건 그대로)
  Object.entries(before).forEach(([k, v]) => {
    if (v <= 0) return;
    if (k.startsWith('foe-')) { const n = fxNode(k); if (n) n.classList.remove('dead'); }
    if (k.startsWith('hp-')) { const m = fxNode('mate-' + k.slice(3)); if (m) m.classList.remove('down'); }
  });
  for (const e of fx) {
    if (e.t === 'guard') {
      document.querySelectorAll('.ex-run-mate:not(.down)').forEach(m => burst(m, 'shield', 700));
      await fxWait(450);
    } else if (e.t === 'slash' || e.t === 'fire') {
      const mate = fxNode('mate-' + e.slug);
      if (mate) shake(mate, 'fx-hop');
      if (e.mp != null) setBar('mp-' + e.slug, e.mp);
      const target = fxNode('foe-' + e.foe);
      burst(target, e.t);
      await fxWait(120);
      shake(target, 'fx-hit');
      popNumber(target, String(e.dmg), e.t === 'fire' ? 'fire' : '');
      setBar('foe-' + e.foe, e.hp);
      if (e.kill && target) target.classList.add('dead');
      await fxWait(190);
    } else if (e.t === 'bite' || e.t === 'sweep') {
      const foeNode = fxNode('foe-' + e.foe);
      shake(foeNode, 'fx-lunge');
      if (e.t === 'sweep') {
        const st = document.getElementById('ex-stage');
        burst(st, 'sweep', 600);
      }
      await fxWait(220);
      e.hits.forEach(h => {
        const m = fxNode('mate-' + h.slug);
        shake(m, 'fx-hurt');
        popNumber(m, '-' + h.dmg, 'hurt');
        setBar('hp-' + h.slug, h.hp);
        if (h.hp <= 0 && m) m.classList.add('down');
      });
      await fxWait(380);
    }
  }
  await fxWait(120);
  done();
}

function winFloor(lines) {
  const r = S.tower.run;
  let pts = 0;
  const drops = {};
  const chance = (id, p) => { if (Math.random() < p) drops[id] = (drops[id] || 0) + 1; };
  r.foes.forEach(foe => {
    pts += Math.round(foe.maxHp / 5);
    S.tower.seen[foe.id] = true;
    chance('game_shealingpotion', foe.elite ? 0.5 : 0.15);
    if (foe.elite) { chance('game_healingpotion', 0.3); chance(r.floor >= 15 ? 'gold_bar' : 'game_magicpotion', 0.3); }
    if (foe.id === 'dracula') chance('gold_bar', 0.08);
    if (foe.id === 'spider') chance('magicsoul', 0.1);
    if (foe.id === 'reaper') { drops.gold_bar = (drops.gold_bar || 0) + 1; chance('magicsoul', 0.5); }
    if (foe.id === 'mage') { drops.gold_bar = (drops.gold_bar || 0) + 1; drops.magicsoul = (drops.magicsoul || 0) + 1; }
  });
  r.loot.points += pts;
  if (r.floor > S.tower.best && FIRST_CLEAR[r.floor]) addItems(drops, FIRST_CLEAR[r.floor]);
  addItems(r.loot.items, drops);
  S.tower.best = Math.max(S.tower.best, r.floor);
  lines.push(r.foes.length > 1 ? `몬스터 ${r.foes.length}마리를 모두 물리쳤어요! +${pts}P` : `${josa(r.foes[0].name, '을', '를')} 물리쳤어요! +${pts}P`);
  if (Object.keys(drops).length) lines.push(`얻은 것: ${itemsText(drops)}`);
  r.foes = null;
  if (r.guest && r.guest.ask === 'hunt') return resolveHelp(lines);
  r.log = lines;
  r.room = 'cleared';
  r.scene = 'stairs';
  r.result = r.floor % TOWER_SAVE_EVERY === 0 ? '저장 지점이에요. 저장하면 모은 포인트와 아이템이 내 것이 되고, 파티가 회복해요.' : '위층으로 올라갈까요?';
  save();
  renderExplore();
  showTowerStory(r.floor);
}

// ----- 도움 요청 -----
function takeItem(id) {
  const r = S.tower.run;
  if (r.loot.items[id]) { r.loot.items[id] -= 1; if (!r.loot.items[id]) delete r.loot.items[id]; return true; }
  if ((S.goodsBag[id] || 0) > 0) { S.goodsBag[id] -= 1; return true; }
  return false;
}

function acceptHelp() {
  const r = S.tower.run;
  const ask = r.guest.ask;
  if (ask === 'maze') return startMaze();
  if (ask === 'supply') {
    const id = POTION_ORDER.find(x => bagCount(x) > 0);
    if (!id || !takeItem(id)) return toast('줄 수 있는 물약이 없어요');
    return resolveHelp([`${josa(EX_ITEMS[id].name, '을', '를')} 건네줬어요.`]);
  }
  // 몬스터 퇴치: 그 층 수준의 잡몹 2마리
  const foes = [floorFoe(r.floor), floorFoe(r.floor)];
  r.room = 'battle';
  r.scene = 'hall';
  r.foes = foes;
  r.target = 0;
  r.log = [`${josa(foes[0].name, '이', '가')} 두 마리나 나타났다!`];
  save();
  renderExplore();
}

function resolveHelp(lines) {
  const r = S.tower.run;
  const name = ANIMAL_BY_SLUG[r.guest.slug].name;
  r.scene = 'lost';
  if (Math.random() < HELP_GHOST) return ghostTrick(lines, name);
  const kind = pick(['points', 'gear', ...HELP_MATERIALS]);
  if (kind === 'points') {
    r.loot.points += HELP_REWARD_POINTS;
    lines.push(`${name} 아이: “정말 고마워요! 이거 받으세요!” +${HELP_REWARD_POINTS}P`);
  } else {
    const id = kind === 'gear' ? pickGear() : kind;
    addItems(r.loot.items, { [id]: 1 });
    lines.push(`${name} 아이: “정말 고마워요! 이거 받으세요!” ${josa(EX_ITEMS[id].name, '을', '를')} 받았어요.`);
  }
  r.helpResult = { ghost: false, slug: r.guest.slug };
  clearRoom(lines, '도움 성공!');
}

function pickGear() {
  const gear = Object.keys(EX_ITEMS).filter(x => EX_ITEMS[x].tier);
  let n = Math.random() * gear.reduce((a, x) => a + HELP_GEAR_TIER_WEIGHT[EX_ITEMS[x].tier], 0);
  for (const x of gear) { n -= HELP_GEAR_TIER_WEIGHT[EX_ITEMS[x].tier]; if (n < 0) return x; }
  return gear[0];
}

function ghostTrick(lines, name) {
  const r = S.tower.run;
  const P = HELP_PENALTY;
  const potions = () => Object.keys(EX_ITEMS).filter(id => EX_ITEMS[id].kind === 'potion' && bagCount(id) > 0);
  const gearSlots = [];
  partyMates().forEach(c => ['weapon', 'shield'].forEach(kind => {
    if ((c.gear || {})[kind] && !(r.sealed || []).some(x => x.slug === c.slug && x.kind === kind)) gearSlots.push({ slug: c.slug, kind });
  }));
  const options = ['points', 'curse', 'retreat'];
  if (potions().length) options.push('potions');
  if (gearSlots.length) options.push('seal');
  const kind = pick(options);
  lines.push(`“속았지롱~!” ${name} 아이는 장난꾸러기 유령이 변신한 거였어요!`);
  if (kind === 'points') {
    const lost = Math.min(S.points, P.points);
    S.points -= lost;
    renderPoints();
    lines.push(`유령이 주머니를 털어 갔어요. -${lost}P`);
  } else if (kind === 'potions') {
    const gone = [];
    for (let i = 0; i < P.potions; i++) {
      const left = potions();
      if (!left.length) break;
      const id = pick(left);
      takeItem(id);
      gone.push(EX_ITEMS[id].name);
    }
    lines.push(`유령이 물약을 훔쳐 달아났어요: ${gone.join(', ')}`);
  } else if (kind === 'curse') {
    r.debuff = { from: r.floor, until: r.floor + P.debuffFloors, ratio: P.debuffRatio };
    lines.push(`유령의 저주! 앞으로 ${P.debuffFloors}층 동안 능력치가 ${Math.round((1 - P.debuffRatio) * 100)}% 줄어요.`);
  } else if (kind === 'retreat') {
    const to = Math.max(1, r.floor - P.retreat);
    lines.push(`유령이 길을 비틀어 놓았어요! ${to}층으로 떨어졌어요.`);
    r.floor = to;
  } else {
    const slot = pick(gearSlots);
    r.sealed = [...(r.sealed || []), slot];
    const c = companionOf(slot.slug);
    lines.push(`유령이 ${c.name}의 ${EX_ITEMS[c.gear[slot.kind]].name}에 봉인을 걸었어요. 이번 탐험 동안 쓸 수 없어요.`);
  }
  r.helpResult = { ghost: true };
  clearRoom(lines, '유령의 장난!');
}

// ----- 미로 찾기 -----
// 칸마다 벽 비트(1=위, 2=오른쪽, 4=아래, 8=왼쪽). 무작위 깊이 우선 탐색으로 길을 판다.
let maze = null;
let mazeTimer = null;
function makeMaze(n) {
  const walls = Array(n * n).fill(15);
  const seen = Array(n * n).fill(false);
  const stack = [0];
  seen[0] = true;
  const dirs = [[0, -1, 1, 4], [1, 0, 2, 8], [0, 1, 4, 1], [-1, 0, 8, 2]];
  while (stack.length) {
    const cur = stack[stack.length - 1];
    const x = cur % n, y = Math.floor(cur / n);
    const next = dirs.map(([dx, dy, w, back]) => [x + dx, y + dy, w, back])
      .filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < n && ny < n && !seen[ny * n + nx]);
    if (!next.length) { stack.pop(); continue; }
    const [nx, ny, w, back] = pick(next);
    const ni = ny * n + nx;
    walls[cur] &= ~w;
    walls[ni] &= ~back;
    seen[ni] = true;
    stack.push(ni);
  }
  return { n, walls, x: 0, y: 0 };
}

function startMaze(resume) {
  const r = S.tower.run;
  const n = mazeSize(r.floor);
  maze = makeMaze(n);
  maze.end = Date.now() + mazeSeconds(n) * 1000;
  maze.img = new Image();
  maze.img.onload = drawMaze;
  maze.img.src = sprite(r.guest.slug, 0);
  clearInterval(mazeTimer);
  mazeTimer = setInterval(() => {
    if (!maze) return clearInterval(mazeTimer);
    if (Date.now() >= maze.end) return endMaze(false);
    drawMaze();
  }, 250);
  if (!resume) {
    r.room = 'maze';
    r.log = [];
    save();
    renderExplore();
  }
}

function drawMaze() {
  const cv = document.getElementById('maze-canvas');
  if (!cv || !maze) return;
  const g = cv.getContext('2d');
  const { n, walls } = maze;
  const W = cv.width, cell = W / n;
  g.fillStyle = '#1b0c40';
  g.fillRect(0, 0, W, W);
  // 출구
  g.fillStyle = '#ffd75e';
  g.beginPath();
  g.arc((n - 0.5) * cell, (n - 0.5) * cell, cell * 0.32, 0, Math.PI * 2);
  g.fill();
  g.strokeStyle = '#cdb8f2';
  g.lineWidth = Math.max(3, cell * 0.09);
  g.lineCap = 'round';
  g.beginPath();
  for (let i = 0; i < n * n; i++) {
    const x = (i % n) * cell, y = Math.floor(i / n) * cell, w = walls[i];
    if (w & 1) { g.moveTo(x, y); g.lineTo(x + cell, y); }
    if (w & 2) { g.moveTo(x + cell, y); g.lineTo(x + cell, y + cell); }
    if (w & 4) { g.moveTo(x, y + cell); g.lineTo(x + cell, y + cell); }
    if (w & 8) { g.moveTo(x, y); g.lineTo(x, y + cell); }
  }
  g.stroke();
  const px = maze.x * cell, py = maze.y * cell;
  if (maze.img && maze.img.complete && maze.img.naturalWidth) {
    const s = cell * 0.9, ratio = maze.img.naturalWidth / maze.img.naturalHeight;
    const w = ratio >= 1 ? s : s * ratio, h = ratio >= 1 ? s / ratio : s;
    g.drawImage(maze.img, px + (cell - w) / 2, py + (cell - h) / 2, w, h);
  } else {
    g.fillStyle = '#ff7aa2';
    g.beginPath();
    g.arc(px + cell / 2, py + cell / 2, cell * 0.3, 0, Math.PI * 2);
    g.fill();
  }
  const t = document.querySelector('.ex-maze-time');
  if (t) {
    const left = Math.max(0, Math.ceil((maze.end - Date.now()) / 1000));
    t.textContent = `남은 시간 ${left}초`;
    t.classList.toggle('hurry', left <= 5);
  }
}

function moveMaze(dx, dy) {
  if (!maze) return;
  const { n, walls } = maze;
  const bit = dy === -1 ? 1 : dx === 1 ? 2 : dy === 1 ? 4 : 8;
  if (walls[maze.y * n + maze.x] & bit) return;
  maze.x += dx;
  maze.y += dy;
  if (maze.x === n - 1 && maze.y === n - 1) return endMaze(true);
  drawMaze();
}

function bindMazeSwipe(cv) {
  let sx = null, sy = null;
  cv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  cv.addEventListener('pointerup', e => {
    if (sx == null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    sx = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) moveMaze(Math.sign(dx), 0); else moveMaze(0, Math.sign(dy));
  });
}
document.addEventListener('keydown', e => {
  if (!maze || currentTab !== 'explore') return;
  const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
  if (k) { e.preventDefault(); moveMaze(...k); }
});

// 브라우저 테스트용: ?test 로 열었을 때만 미로 상태를 들여다볼 수 있게
if (location.search.includes('test')) window.__dnMaze = () => maze;

function endMaze(ok) {
  clearInterval(mazeTimer);
  maze = null;
  const r = S.tower.run;
  if (!r || r.room !== 'maze') return;
  if (ok) return resolveHelp(['출구를 찾았어요!']);
  r.scene = 'lost';
  clearRoom([`시간 안에 출구를 찾지 못했어요. ${ANIMAL_BY_SLUG[r.guest.slug].name} 아이는 혼자 길을 찾아보겠대요.`], '길 찾기 실패');
}

function showTowerStory(floor) {
  const story = TOWER_STORY[floor];
  if (!story || S.tower.story[floor]) return;
  S.tower.story[floor] = true;
  save();
  openModal(box => {
    box.append(el('h3', null, story[0]));
    story.slice(1).forEach(line => box.append(el('p', null, line)));
    const ok = el('button', 'btn', '계속');
    ok.addEventListener('click', closeModal);
    box.append(ok);
  });
}

function answerQuiz(i) {
  const r = S.tower.run;
  const [, opts, right] = NONSENSE[r.quiz];
  const lines = [];
  if (i === right) {
    const prize = pick(['game_healingpotion', 'game_magicpotion', 'game_shealingpotion']);
    addItems(r.loot.items, { [prize]: 1 });
    r.loot.points += 30;
    lines.push(`정답! “${opts[right]}” 보물로 ${josa(EX_ITEMS[prize].name, '과', '와')} 30P를 받았어요.`);
  } else {
    lines.push(`땡! 정답은 “${opts[right]}”. 지배인이 깔깔 웃는 사이 지나갔어요.`);
  }
  clearRoom(lines);
}

function openPotions() {
  const potions = Object.keys(EX_ITEMS).filter(id => EX_ITEMS[id].kind === 'potion' && bagCount(id) > 0);
  openModal(box => {
    box.append(el('h3', null, '물약 쓰기'));
    box.append(el('p', null, '살아 있는 동료 모두에게 효과가 있어요. 물약은 차례를 쓰지 않아요.'));
    if (!potions.length) box.append(el('p', null, '가진 물약이 없어요. 마법 상인 길데스텐에게 살 수 있어요.'));
    const grid = el('div', 'food-grid');
    potions.forEach(id => {
      const it = EX_ITEMS[id];
      const card = el('div', 'food-card');
      const im = el('img');
      im.src = exImg(id);
      im.alt = '';
      const btn = el('button', null, '쓰기');
      btn.addEventListener('click', () => usePotion(id));
      card.append(im, el('strong', null, it.name), el('small', null, `${it.hp ? '체력 +' + it.hp : '마력 +' + it.mp} · ${bagCount(id)}개`), btn);
      grid.append(card);
    });
    box.append(grid);
    const ok = el('button', 'btn ghost', '닫기');
    ok.addEventListener('click', closeModal);
    box.append(ok);
  });
}

function usePotion(id) {
  const r = S.tower.run;
  const it = EX_ITEMS[id];
  if (r.loot.items[id]) { r.loot.items[id] -= 1; if (!r.loot.items[id]) delete r.loot.items[id]; }
  else S.goodsBag[id] -= 1;
  const before = snapshotBars();
  const healed = [];
  liveMembers().forEach(({ c, f, st }) => {
    const h0 = st.hp, m0 = st.mp;
    if (it.hp) st.hp = Math.min(f.hp, st.hp + it.hp);
    if (it.mp) st.mp = Math.min(f.mp, st.mp + it.mp);
    healed.push({ slug: c.slug, hp: st.hp, mp: st.mp, dh: st.hp - h0, dm: st.mp - m0 });
  });
  r.log = [`${josa(it.name, '을', '를')} 썼어요.`];
  save();
  closeModal();
  fxBusy = true;
  renderExplore();
  Object.entries(before).forEach(([k, v]) => setBar(k, v));
  setTimeout(() => {
    healed.forEach(h => {
      const m = fxNode('mate-' + h.slug);
      burst(m, 'heal', 700);
      if (h.dh) popNumber(m, '+' + h.dh, 'heal');
      if (h.dm) popNumber(m, '+' + h.dm, 'mana');
      setBar('hp-' + h.slug, h.hp);
      setBar('mp-' + h.slug, h.mp);
    });
    setTimeout(() => { fxBusy = false; }, 500);
  }, FX_REDUCED ? 0 : 60);
}

function bankLoot() {
  const r = S.tower.run;
  S.points += r.loot.points;
  addItems(S.goodsBag, r.loot.items);
  const got = r.loot.points || Object.keys(r.loot.items).length ? `${r.loot.points}P${Object.keys(r.loot.items).length ? ', ' + itemsText(r.loot.items) : ''}` : '없음';
  r.loot = { points: 0, items: {} };
  renderPoints();
  return got;
}

function saveTower() {
  const r = S.tower.run;
  const got = bankLoot();
  if (r.floor >= TOWER_TOP) {
    S.tower.cleared = true;
    S.tower.run = null;
    save();
    openModal(box => {
      box.append(el('h3', null, '북쪽 탑 정복!'));
      box.append(el('p', null, `암흑의 마도사를 물리치고 탑 꼭대기에 올랐어요. 받은 것: ${got}`));
      box.append(el('p', null, '이제 1·11·21층 어디서든 다시 올라 재료를 모을 수 있어요.'));
      const ok = el('button', 'btn', '확인');
      ok.addEventListener('click', () => { closeModal(); renderExplore(); });
      box.append(ok);
    });
    renderExplore();
    return;
  }
  S.tower.saved = Math.max(S.tower.saved, r.floor + 1);
  partyMates().forEach(c => { const f = fighter(c); if (r.members[c.slug]) r.members[c.slug] = { hp: f.hp, mp: f.mp }; });
  r.log = [`저장했어요! 받은 것: ${got}`, '파티의 체력과 마력이 모두 회복됐어요.'];
  r.result = `다음부터는 ${r.floor + 1}층에서 시작할 수 있어요.`;
  save();
  renderExplore();
}

function confirmLeave() {
  const r = S.tower.run;
  const lose = r.loot.points || Object.keys(r.loot.items).length;
  openModal(box => {
    box.append(el('h3', null, '탑에서 나갈까요?'));
    box.append(el('p', null, lose ? `저장하지 않은 전리품을 잃어요: ${r.loot.points}P${Object.keys(r.loot.items).length ? ', ' + itemsText(r.loot.items) : ''}` : '잃는 것은 없어요.'));
    const row = el('div', 'modal-actions');
    const no = el('button', 'btn ghost', '계속 탐험');
    no.addEventListener('click', closeModal);
    const yes = el('button', 'btn', '나가기');
    yes.addEventListener('click', () => { clearInterval(mazeTimer); maze = null; S.tower.run = null; save(); closeModal(); exploreView = 'hub'; renderExplore(); });
    row.append(no, yes);
    box.append(row);
  });
}

function wipeOut() {
  clearInterval(mazeTimer);
  maze = null;
  const r = S.tower.run;
  const floor = r.floor;
  S.tower.run = null;
  save();
  renderExplore();
  openModal(box => {
    box.append(el('h3', null, '파티가 모두 쓰러졌어요'));
    box.append(el('p', null, `${floor}층에서 정신을 잃고 탑 입구로 돌아왔어요. 저장하지 않은 포인트와 아이템은 잃어버렸어요.`));
    box.append(el('p', null, '동료를 더 키우거나 장비를 갖춰서 다시 도전해 봐요.'));
    const ok = el('button', 'btn', '확인');
    ok.addEventListener('click', closeModal);
    box.append(ok);
  });
}

// 아이템박스 '용품' 탭
function goodsCards() {
  return Object.keys(EX_ITEMS).filter(id => (S.goodsBag[id] || 0) > 0).map(id => {
    const it = EX_ITEMS[id];
    const card = el('div', 'food-card');
    const img = el('img');
    img.src = exImg(id);
    img.alt = '';
    const btn = el('button', null, it.kind === 'material' ? '연금술 재료' : '탐험에서 쓰기');
    btn.disabled = it.kind === 'material';
    btn.addEventListener('click', () => showTab('explore'));
    card.append(img, el('strong', null, it.name), el('small', null, `${EX_KIND[it.kind]} · ${S.goodsBag[id]}개`), btn);
    return card;
  });
}

// ===== 시작 =====
renderPoints();
showTab('farm');

if ('serviceWorker' in navigator && window.top === window && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
