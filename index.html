<meta charset="utf-8">
<title>동물농장</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6b400">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  color-scheme:light;
  --gold:#f6b400;--gold-deep:#d98e00;--orange:#f07b00;--cream:#fff8e3;--paper:#fffdf6;
  --ink:#5a3a12;--ink-soft:#8a6a3e;--line:#ecd9a8;
  --sky-top:#7fcdf2;--sky-bottom:#d8f3ff;--grass:#86c540;--grass-deep:#5d9e2a;
  --love:#ff7aa2;--know:#4f9be6;--charm:#b07ce8;--power:#f5893a;
  --display:"Jua","BM JUA","Malgun Gothic","맑은 고딕",sans-serif;
  --body:"Gowun Dodum","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  --nav-h:66px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#f3e7c4;height:100%}
/* 페이지 전체가 아니라 가운데(main)만 스크롤: 홈 화면 앱 모드에서 화면 높이가 실제보다 크게 잡혀
   아래 고정 메뉴/내용이 시스템 버튼 줄 밑으로 숨던 문제 방지 */
body{margin:0;height:100%;overflow:hidden;background:#f3e7c4;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid #4f9be6;outline-offset:2px}
img{max-width:100%}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative;box-shadow:0 0 0 1px var(--line)}
.app>main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:16px}

/* 상단 바 */
.topbar{flex:none;position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 12px 4px 4px;background:#fff;border-bottom:3px solid var(--gold)}
.logo{margin:0;line-height:0}
.logo img{height:54px;width:auto}
.points{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--gold-deep);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.points i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;font-style:normal;font-size:12px}

.screen{padding:0 16px}
.section-title{font-family:var(--display);font-size:20px;margin:18px 0 10px;display:flex;align-items:baseline;gap:8px}
.section-title span{font-family:var(--body);font-size:12px;color:var(--ink-soft)}

/* 농장 무대 */
.stage{position:relative;margin:0 -16px;height:270px;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-bottom) 62%);border-bottom:3px solid var(--grass-deep)}
.stage::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-60px;height:130px;border-radius:50% 50% 0 0;background:var(--grass);box-shadow:inset 0 10px 0 #9fd65b}
.stage.has-bg{height:auto;aspect-ratio:557/342;background-size:cover;background-position:center bottom}
/* 원작 돌보기 방: 515x399, 구름 말풍선은 x 31~79%, y 10~37% */
.stage.room{height:auto;aspect-ratio:515/399;background-size:100% 100%;border-bottom:3px solid #8cc43c}
.stage.room::after{display:none}
.stage.room .bubble{left:55%;top:12%;width:44%;height:22%;max-width:none;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:0;padding:0 6px;font-size:15px;line-height:1.35;color:#3d2a10}
.stage.room .bubble::after{display:none}
.stage.room .pet{bottom:9%}
.stat.short .stat-top span{color:var(--orange);font-weight:700}
.stat.fatigue{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line)}
.fatigue-risk{margin-top:4px;font-size:12px;color:#c2410c;word-break:keep-all}
.badge.sick{background:#e4f3ff;border-color:#4f9be6;color:#1d5fa8}
.pet.sick{filter:saturate(.55) brightness(.95) drop-shadow(0 6px 0 rgba(60,90,20,.25))}
.sick-card{margin-top:12px;padding:12px;border-radius:14px;background:#eef7ff;border:2px solid #9cc8f0;display:flex;flex-direction:column;gap:6px}
.sick-card strong{font-family:var(--display);font-weight:400;font-size:17px;color:#1d5fa8}
.sick-card p{margin:0;font-size:13px;color:var(--ink-soft);word-break:keep-all}
.sick-card .btn{align-self:flex-start}
.hosp-txt{display:block;max-width:100%;height:auto;margin:12px auto}
.rx{margin:10px 0;padding:8px 12px;border-radius:10px;background:#fff4f8;border:2px dashed #f29ab8;font-size:13px;word-break:keep-all}
.ending:disabled{background:#cfc6ae;border-bottom-color:#a99e83;font-size:15px}
.stat.fatigue .meter b{background:linear-gradient(90deg,#9aa0a6,#5f6368)}
.stat.fatigue.tired .stat-top span{color:#d23c1e;font-weight:700}
.wish{margin-top:14px;background:#fff;border:2px solid #5a8ee6;border-radius:16px;overflow:hidden}
.wish h3{margin:0;padding:6px 12px;background:#2f6ad0;color:#fff;font-family:var(--display);font-weight:400;font-size:15px}
.wish-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.wish-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:12px;background:#eef1f5;border:2px solid #d6dbe3;font-family:var(--display)}
.wish-btn strong{font-weight:400;font-size:17px}
.wish-btn small{font-family:var(--body);font-size:11px;color:var(--ink-soft)}
.wish-btn.want{background:#ffe27a;border-color:#f0a800}
.wish-btn.want small{color:#b35a00;font-weight:700}
.wish-btn:disabled{opacity:.55}
/* 실외 마당 */
.stage.yard{height:auto;aspect-ratio:557/342;background-size:100% 100%;user-select:none;-webkit-user-select:none}
.stage.yard::after{display:none}
.stage.yard.editing{touch-action:none;box-shadow:inset 0 0 0 3px #74bf17}
.deco{position:absolute;transform:translate(-50%,-100%);max-width:none;width:12%;-webkit-user-drag:none}
.stage.yard.editing .deco{cursor:grab}
.stage.yard.editing .yard-pet{pointer-events:none;opacity:.55}
.deco.sel{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #2f8f00)}
.yard-pet{position:absolute;transform:translate(-50%,-100%);max-width:none;transition:left 2.4s ease-in-out,top 2.4s ease-in-out}
@media (prefers-reduced-motion:reduce){.yard-pet{transition:none}}
.yard-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn.green{background:#8fd42a;border-bottom-color:#5a9a10;color:#fff}
.sub-title{font-family:var(--display);font-weight:400;font-size:16px;margin:16px 0 8px}
.sub-title span{font-family:var(--body);font-size:12px;color:var(--ink-soft);margin-left:6px}
.sel-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;padding:8px 10px;background:#f1fbe2;border:2px solid #b7e27a;border-radius:12px;font-size:13px}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tray-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:#fff;border:2px solid var(--line);border-radius:12px;font-size:12px;text-align:center;word-break:keep-all}
.tray-item img{width:56px;height:56px;object-fit:contain}
.tray-item small{color:var(--ink-soft)}
.skins{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.skins button{flex:0 0 96px;aspect-ratio:557/342;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);background-size:cover;background-position:center}
.skins button[aria-pressed=true]{border-color:#74bf17;box-shadow:none}
.link-btn{font:inherit;color:#2f6ad0;text-decoration:underline;padding:0}
.deco-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(102px,1fr));gap:10px}
.deco-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;background:#fff;border:2px solid var(--line);border-radius:14px;text-align:center;word-break:keep-all}
.deco-card img{width:72px;height:72px;object-fit:contain}
.deco-card strong{font-family:var(--display);font-weight:400;font-size:14px;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.deco-card small{font-size:11px;color:var(--ink-soft);min-height:1.4em}
.deco-card button{margin-top:auto;width:100%;font-family:var(--display);font-size:14px;padding:5px;border-radius:10px;background:#8fd42a;border-bottom:3px solid #5a9a10;color:#fff}
.deco-card button:disabled{background:#e4e0d2;border-bottom-color:#c9c2ab;color:#9b8b66}
/* 날짜 / 일정 */
.date-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -16px;padding:7px 16px;font-family:var(--display);font-size:16px;color:#fff;background:#7cc24a}
.date-bar.season-summer{background:#2fb6e3}.date-bar.season-autumn{background:#e58a1f}.date-bar.season-winter{background:#7d8fd6}
.season-chip{font-size:13px;padding:1px 10px;border-radius:999px;background:rgba(255,255,255,.3)}
.care-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:6px}
.care-left{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.actions.three{grid-template-columns:repeat(3,1fr)}
.actions.three .act{font-size:16px}
.schedules{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sched{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 12px;border-radius:14px;background:#fff;border:2px solid #b9d8f5;border-bottom-width:4px;text-align:left}
.sched strong{font-family:var(--display);font-weight:400;font-size:17px;color:#2f6ad0}
.sched small{font-size:11px;color:var(--ink-soft)}
.sched em{font-style:normal;font-size:12px;color:var(--orange);font-weight:700;margin-top:2px}
.sched:disabled{opacity:.45}
.warn{color:#c2410c!important;font-size:13px!important}
.next-date{font-family:var(--display);color:#2f6ad0!important}
.travel-img{width:100%;border-radius:12px;margin-bottom:6px}
/* 마을 */
.back-btn{margin:12px 0 4px;font-family:var(--display);font-size:15px;color:#2f6ad0;padding:4px 0}
/* 동물학교 */
.school-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.school-btn{padding:0;border-radius:14px;overflow:hidden;line-height:0}
.school-btn img{width:100%;height:auto}
.school-btn:disabled{filter:grayscale(.8) opacity(.6)}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gallery img{width:100%;height:auto;border-radius:8px;border:2px solid var(--line);background:#fff}
.teacher{display:flex;justify-content:center;margin-top:6px}
.teacher img{width:100%;max-width:248px;height:auto;border-radius:12px}
.quiz-count{margin:12px 0 0;font-size:12px;color:var(--ink-soft);text-align:center}
.quiz-q{margin:6px 0 12px;font-family:var(--display);font-size:20px;text-align:center;word-break:keep-all}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:12px;border-radius:14px;background:#fff;border:2px solid #b9d8f5;border-bottom-width:4px;font-family:var(--display);font-size:17px}
.quiz-opt.right{background:#e6f9d8;border-color:#6cc23a}
.quiz-opt.wrong{background:#ffe8e8;border-color:#e36b6b}
.quiz-ok{color:#2f8f00;font-family:var(--display);text-align:center;margin:10px 0 0}
.sheet-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-pick button{padding:4px;border-radius:12px;background:#fff;border:2px solid var(--line)}
.sheet-pick img{width:100%;height:auto}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
.palette button{aspect-ratio:1;border-radius:50%;border:2px solid #d8cfb8}
.palette button[aria-pressed=true]{border:3px solid var(--ink);transform:scale(1.08)}
.paint-canvas{display:block;width:100%;max-width:360px;height:auto;margin:0 auto;border-radius:12px;border:2px solid var(--line);background:#fff;touch-action:manipulation}
.paint-result{display:block;width:120px;height:auto;margin:6px auto;border-radius:8px;border:2px solid var(--line)}
.book-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);text-align:left}
.book-row strong{font-family:var(--display);font-weight:400;font-size:16px}
.book-row small{font-size:12px;color:var(--ink-soft)}
.book-text{text-align:left!important;line-height:1.8;color:var(--ink)!important;font-size:15px!important}
.teach-form{display:flex;flex-direction:column;gap:8px}
.teach-form input{font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.taught-list{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft)}
/* 아이템박스 (원작 탭 그림) */
.box-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;align-items:end}
.box-tabs button{padding:0;line-height:0}
.box-tabs img{width:100%;height:auto}
.box-panel{min-height:200px;padding:12px 10px;background:#fff;border:3px solid #c3ec5a;border-radius:0 0 14px 14px;margin-top:-3px}
/* 여행사 (원작 배치) */
.town-map{display:block;width:calc(100% + 32px);max-width:none;margin:0 -16px;height:auto}
.town-list{display:flex;flex-direction:column;gap:8px}
.town-row{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px 8px 8px;border-radius:14px;background:#fff;border:2px solid var(--line);text-align:left}
.town-row img{flex:none;width:64px;height:60px;object-fit:cover;object-position:center 30%;border-radius:12px;background:#eaf6ff}
.town-text{flex:1;min-width:0;display:flex;flex-direction:column}
.town-text strong{font-family:var(--display);font-weight:400;font-size:17px}
.town-text small{font-size:12px;color:var(--ink-soft);word-break:keep-all}
.town-go{flex:none;font-family:var(--display);font-size:22px;color:#2fb6e3}
.town-row.soon{background:#f7f4ec}
.town-row.soon img{filter:grayscale(.8) opacity(.6)}
.town-row.soon strong{color:#a8987a}
.town-row.soon .town-go{font-size:12px;color:#fff;background:#b9a679;padding:2px 8px;border-radius:999px}
.travel-bar{display:block;width:100%;height:auto;margin:10px 0 6px}
.spot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.spot-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border-radius:10px;background:#f6e3a8 url("assets/ui/travel/bg_041229travel_sub01.gif") center/100% 100% no-repeat;border:3px solid transparent}
.spot-card.on{border-color:#e07b00;box-shadow:0 0 0 2px #ffd36a}
.spot-name{width:96%;height:auto}
.spot-photo{width:80%;height:auto;border-radius:4px}
.spot-price{font-family:var(--display);font-size:13px;color:#7a4a00}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:var(--display);font-size:14px;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid #f0c860;color:#7a4a00}
.chips button[aria-pressed=true]{background:#ffc928;border-color:#d98e00}
.opt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:10px;background:#fff;border:3px solid transparent}
.opt-card img{width:100%;height:auto}
.opt-card small{font-size:11px;color:var(--ink-soft)}
.opt-card[aria-pressed=true]{border-color:#e07b00;background:#fff4d2}
.travel-preview{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding:10px 12px;border-radius:12px;background:#fffbe9;border:2px dashed #f0c860;font-size:13px;font-variant-numeric:tabular-nums}
.travel-preview strong{font-family:var(--display);font-weight:400;font-size:16px}
/* 쿠킹샵 (원작 요리하기 화면 배치) */
.cook-banner{display:block;width:calc(100% + 32px);max-width:none;margin:4px -16px 0}
.cook-board{display:flex;align-items:flex-start;justify-content:center;gap:6px;margin-top:-6px;padding:14px 8px 4px;background:#fff;border-radius:0 0 16px 16px;border:2px solid #f3d27a;border-top:0}
.cook-slot{display:flex;flex-direction:column;align-items:center;gap:4px;width:42%}
.bowl{position:relative;width:100%;aspect-ratio:100/63;background:url("assets/ui/cook/thum_food.gif") center/contain no-repeat}
.bowl-food{position:absolute;left:50%;bottom:28%;transform:translateX(-50%);max-height:120%;max-width:80%}
.slot-name{font-size:12px;text-align:center;min-height:1.5em;word-break:keep-all}
.pick-btn{font-family:var(--display);font-size:14px;padding:5px 12px;border-radius:999px;background:#fff;border:2px solid #d98e00;color:#7a4a00}
.cook-plus{font-family:var(--display);font-size:30px;color:#f05a9c;margin-top:16px}
.cook-btn{display:block;width:100%;margin-top:10px;padding:12px;border-radius:14px;font-family:var(--display);font-size:19px;color:#2d5a00;background:#a4e23a;border-bottom:4px solid #6aa514}
.cook-btn:disabled{background:#e4e0d2;border-bottom-color:#c9c2ab;color:#9b8b66}
.book-btn{display:block;width:100%;margin-top:12px;padding:6px;border-radius:14px;background:#fff;border:2px solid var(--line)}
.book-btn img{display:block;width:100%;max-width:310px;margin:0 auto}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.food-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;background:#fff;border:2px solid var(--line);border-radius:12px;text-align:center;word-break:keep-all}
.food-card img{width:64px;height:56px;object-fit:contain}
.food-card strong{font-family:var(--display);font-weight:400;font-size:13px;line-height:1.3;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.food-card small{font-size:11px;color:var(--ink-soft);min-height:1.3em}
/* 이름 줄 수와 상관없이 가격 버튼은 항상 카드 맨 아래 */
.food-card button{margin-top:auto;width:100%;font-family:var(--display);font-size:13px;padding:4px;border-radius:9px;background:var(--gold);border-bottom:3px solid var(--gold-deep)}
.food-card button:disabled{background:#e4e0d2;border-bottom-color:#c9c2ab;color:#9b8b66}
.food-grid.pick{max-height:52vh;overflow-y:auto;margin-bottom:12px}
.cook-result{width:110px;height:auto;margin:6px auto;display:block}
.recipe-list{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;margin-bottom:8px}
.recipe-row{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px;background:#fff8e3;border-radius:10px}
.r-item{display:flex;flex-direction:column;align-items:center;width:64px;font-size:10px;line-height:1.2;word-break:keep-all}
.r-item img{width:40px;height:36px;object-fit:contain}
.recipe-row .op{font-family:var(--display);color:#f05a9c}
.chat{display:flex;gap:8px;margin-top:12px}
.chat input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.stage.has-bg::after{display:none}
.pet{position:absolute;left:50%;bottom:34px;z-index:2;transform:translateX(-50%);height:170px;width:auto;max-width:80%;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(60,90,20,.25));transition:transform .2s}
.pet.hop{animation:hop .45s ease}
@keyframes hop{0%,100%{transform:translateX(-50%) translateY(0)}40%{transform:translateX(-50%) translateY(-18px)}}
.bubble{position:absolute;left:50%;top:14px;z-index:3;transform:translateX(-50%);max-width:78%;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:7px 14px;font-size:14px;text-align:center;word-break:keep-all}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.float{position:absolute;z-index:4;font-family:var(--display);font-size:18px;color:#e05a00;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;white-space:nowrap;pointer-events:none;animation:float 1s ease-out forwards}
.pet[data-stage="0"]{height:125px}
.pet[data-stage="1"]{height:150px}
.pet.orig[data-stage]{height:160px}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-46px)}}

/* 펫 정보 */
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px}
.pet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.pet-name{font-family:var(--display);font-size:22px;line-height:1.2;word-break:keep-all}
.pet-kind{font-size:12px;color:var(--ink-soft)}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-family:var(--display);font-size:13px;padding:2px 10px;border-radius:999px;background:var(--cream);border:2px solid var(--gold);white-space:nowrap}
.badge.fire{background:#ffe1d1;border-color:#f07b4a;color:#b5410f}
.growth{margin-top:12px}
.growth-label{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:999px;background:#f1e6c8;overflow:hidden;border:2px solid #e5d3a0}
.meter b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--orange));transition:width .4s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:14px}
.stat-top{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums}
.stat-top strong{font-family:var(--display);font-weight:400}
.stat .meter{height:10px}
.stat[data-k=love] .meter b{background:var(--love)}
.stat[data-k=know] .meter b{background:var(--know)}
.stat[data-k=charm] .meter b{background:var(--charm)}
.stat[data-k=power] .meter b{background:var(--power)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;background:var(--gold);border-bottom:4px solid var(--gold-deep);font-family:var(--display);font-size:18px;color:var(--ink);transition:transform .1s}
.act small{font-family:var(--body);font-size:11px;color:#7a5413}
.act:active{transform:translateY(2px);border-bottom-width:2px}
.act:disabled{background:#eadfc2;border-bottom-color:#cdbf98;color:#9b8b66;cursor:default}
.ending{display:block;width:100%;margin-top:12px;padding:14px;border-radius:16px;background:var(--orange);border-bottom:4px solid #b85a00;color:#fff;font-family:var(--display);font-size:20px}

/* 분양소 / 도감 그리드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:#fff;border:2px solid var(--line);border-radius:14px;font-size:13px;text-align:center;word-break:keep-all}
.tile img{height:64px;width:auto;object-fit:contain}
.tile.locked img{filter:brightness(0) opacity(.18)}
.tile.locked span{color:#b9a679}
.tile .done{font-size:10px;color:var(--orange);font-family:var(--display)}
.tile.taken{background:#f6efdc}
.tile.taken img{opacity:.45}

/* 수첩/동료 전환 */
.seg{display:flex;gap:6px;margin-top:16px;padding:4px;background:var(--cream);border:2px solid var(--line);border-radius:14px}
.seg button{flex:1;padding:8px;border-radius:10px;font-family:var(--display);font-size:16px;color:var(--ink-soft)}
.seg button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.party{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:3/4;border-radius:14px;background:#fff;border:2px solid var(--gold);font-size:12px;text-align:center;word-break:keep-all;padding:4px}
.slot img{height:62%;width:auto;object-fit:contain}
.slot.empty{border-style:dashed;border-color:var(--line);color:#b9a679;background:var(--cream)}
.roster{display:flex;flex-direction:column;gap:10px}
.mate{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.mate.in{border-color:var(--gold);background:var(--cream)}
.mate img{height:64px;width:64px;object-fit:contain}
.mate-top{display:flex;align-items:center;gap:8px}
.mate-top strong{font-family:var(--display);font-weight:400;font-size:17px}
.grade{font-family:var(--display);font-size:13px;min-width:24px;text-align:center;padding:0 6px;border-radius:8px;background:#e9e0c8;color:var(--ink)}
.grade-S{background:#ffd23f}.grade-A{background:#ffb37a}.grade-B{background:#cfe6a8}
.mate-stats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.score-table{display:flex;flex-direction:column;gap:4px;margin:8px auto 12px;max-width:260px;font-variant-numeric:tabular-nums}
.score-table div{display:flex;justify-content:space-between;font-size:14px}
.score-table div:last-child{border-top:2px solid var(--line);padding-top:4px;font-family:var(--display);font-size:17px}

/* 상점 */
.note{font-size:12px;color:var(--ink-soft);margin:12px 0 0;word-break:keep-all}

.btn{font-family:var(--display);font-size:16px;padding:9px 16px;border-radius:14px;background:var(--gold);border-bottom:4px solid var(--gold-deep)}
.btn.ghost{background:var(--cream);border:2px solid var(--line);border-bottom-width:4px}

/* 하단 메뉴 */
.nav{flex:none;position:relative;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px);background:#fff;border-top:3px solid var(--gold);box-shadow:0 -4px 12px rgba(90,58,18,.08)}
.nav-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;height:var(--nav-h);padding:0 4px;align-items:end}
.nav button{position:relative;height:calc(var(--nav-h) - 6px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;padding:0 0 7px;border-radius:14px 14px 0 0;font-family:var(--display);font-size:14px;color:var(--c);transition:background .15s}
.nav button img{width:36px;height:32px;object-fit:contain;opacity:.75;filter:saturate(.6);transition:transform .2s,opacity .2s,filter .2s}
.nav button[aria-current=page]{background:var(--c);color:#fff}
.nav button[aria-current=page] img{opacity:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15));transform:translateY(-12px) scale(1.3)}
/* 원작 탭의 흰 둥근 모서리 장식 */
.nav button[aria-current=page]::before,.nav button[aria-current=page]::after{content:"";position:absolute;top:4px;width:8px;height:8px;border-top:2px solid #fff}
.nav button[aria-current=page]::before{left:5px;border-left:2px solid #fff;border-top-left-radius:8px}
.nav button[aria-current=page]::after{right:5px;border-right:2px solid #fff;border-top-right-radius:8px}
@media (prefers-reduced-motion:reduce){.nav button img{transition:none}}

/* 탐험 (원작 보라색 성 + 몬스터 도감 남색) */
.explore{--ex-deep:#2a1460;--ex-mid:#5b2fb5;--ex-glow:#ffd75e}
.ex-head{display:block;width:calc(100% + 32px);max-width:none;margin:0 -16px;height:auto}
.ex-legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:10px;border-radius:14px;background:#fff;border:2px solid #cdb8f2}
.ex-legend img{width:100%;height:auto;border-radius:10px}
.ex-legend p{margin:0;font-size:13px;color:var(--ink-soft);word-break:keep-all}
.ex-progress{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--ex-deep);color:var(--ex-glow);font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.ex-party{display:flex;flex-direction:column;gap:8px}
.ex-mate{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:14px;background:#fff;border:2px solid #cdb8f2;text-align:left}
.ex-mate>img{width:56px;height:56px;object-fit:contain}
.ex-mate-info strong{font-family:var(--display);font-weight:400;font-size:16px}
.ex-stats{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.ex-gear{display:flex;gap:4px}
.ex-gear img,.ex-gear-empty{width:34px;height:34px;object-fit:contain;border-radius:8px;background:#f1eafd}
.ex-gear-empty{display:grid;place-items:center;font-size:10px;color:#9a87c2;border:1px dashed #cdb8f2}
.ex-gear-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.ex-gear-pick button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:4px;border-radius:10px;background:#fff;border:2px solid var(--line);word-break:keep-all}
.ex-gear-pick button[aria-pressed=true]{border-color:#5b2fb5;background:#f1eafd}
.ex-gear-pick img{width:40px;height:40px;object-fit:contain}
.ex-gear-pick small{font-size:10px;line-height:1.2}
.ex-go{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ex-btn{display:block;width:100%;padding:12px;border-radius:14px;font-family:var(--display);font-size:18px;color:#fff;background:#5b2fb5;border-bottom:4px solid #2a1460}
.ex-btn.ghost{background:#efe7fc;color:#2a1460;border:2px solid #cdb8f2;border-bottom-width:4px}
.ex-btn:disabled{background:#d9d2e6;border-bottom-color:#b9afc9;color:#8a809b}
.ex-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ex-menu-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px;border-radius:14px;background:#fff;border:2px solid #cdb8f2;text-align:center;word-break:keep-all}
.ex-menu-btn img{height:64px;width:auto;max-width:100%;object-fit:contain}
.ex-menu-btn strong{font-family:var(--display);font-weight:400;font-size:15px}
.ex-menu-btn small{font-size:11px;color:var(--ink-soft)}
.ex-merchant{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ex-merchant img{width:42%;height:auto}
.ex-merchant p{flex:1;margin:0;padding:10px;border-radius:12px;background:#f1eafd;font-size:13px;word-break:keep-all}
.ex-book{display:flex;flex-direction:column;gap:8px}
.ex-book-row{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;padding:10px;border-radius:14px;background:#fff;border:2px solid #cdb8f2}
.ex-book-row img{width:96px;height:80px;object-fit:contain}
.ex-book-row strong{font-family:var(--display);font-weight:400;font-size:17px;color:#b0127a}
.ex-book-row small{display:block;font-size:12px;color:var(--ink-soft);word-break:keep-all}
.ex-book-row.unseen img{filter:brightness(0) opacity(.25)}
.ex-floorbar{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 -16px;padding:8px 16px;background:#2a1460;color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.ex-floorbar strong{font-family:var(--display);font-weight:400;font-size:18px;color:#ffd75e}
.ex-stage{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 -16px;padding:12px 16px 14px;min-height:230px;background:radial-gradient(ellipse at 50% 55%,#d9c8fb 0%,#9a74e6 30%,#4a248f 70%,#1b0c40 100%);color:#fff}
.ex-stage.talk{justify-content:center}
.ex-foe-name{font-family:var(--display);font-size:19px;color:#ffd75e;text-shadow:0 2px 0 #1b0c40}
.ex-foe{height:150px;width:auto;max-width:90%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,255,255,.75)) drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.ex-foe-stat{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.ex-quiz-q{margin:0;max-width:30em;font-family:var(--display);font-size:18px;text-align:center;word-break:keep-all}
.ex-bar{position:relative;width:100%;height:14px;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden}
.ex-bar b{display:block;height:100%;border-radius:999px;transition:width .3s}
.ex-bar span{position:absolute;inset:0;font-size:10px;line-height:14px;text-align:center;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
.ex-bar.foe{max-width:260px;height:16px}
.ex-bar.foe span{line-height:16px;font-size:11px}
.ex-bar.foe b{background:linear-gradient(90deg,#ff5a5a,#ff9a3c)}
.ex-bar.hp b{background:#43c35a}
.ex-bar.mp b{background:#4f9be6}
.ex-run-party{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.ex-run-mate{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:12px;background:#fff;border:2px solid #cdb8f2;font-size:11px;text-align:center;word-break:keep-all}
.ex-run-mate img{height:44px;width:auto;object-fit:contain}
.ex-run-mate .ex-bar{height:12px;background:#e4def0}
.ex-run-mate .ex-bar span{line-height:12px;color:#2a1460;text-shadow:none}
.ex-run-mate.down{opacity:.45;filter:grayscale(1)}
.ex-log{margin-top:10px;padding:8px 12px;border-radius:12px;background:#f6f2fd;border:2px dashed #cdb8f2;font-size:13px;line-height:1.6;font-variant-numeric:tabular-nums}
.ex-cmds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ex-cmds.one{grid-template-columns:1fr}
.ex-cmd{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px;border-radius:14px;color:#fff;font-family:var(--display);background:linear-gradient(#3a5bb8,#1f3577);border-bottom:4px solid #142452}
.ex-cmd strong{font-weight:400;font-size:18px}
.ex-cmd small{font-family:var(--body);font-size:11px;opacity:.85}
.ex-cmd-guard{background:linear-gradient(#c79a1a,#8a6400);border-bottom-color:#5c4300}
.ex-cmd-magic{background:linear-gradient(#b4389a,#6e1a5e);border-bottom-color:#4a0f3f}
.ex-cmd-item{background:linear-gradient(#3fa36b,#1f6a40);border-bottom-color:#134428}
.ex-cmd:disabled{filter:grayscale(1) opacity(.5)}
.ex-leave{display:block;margin:12px auto 0}
.ex-door{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 12px;border-radius:60px 60px 12px 12px;background:linear-gradient(#6b3fc9,#3a1c86);border:3px solid #ffd75e;border-bottom-width:6px;color:#fff;text-align:center;word-break:keep-all}
.ex-door strong{font-family:var(--display);font-weight:400;font-size:19px;color:#ffd75e}
.ex-door small{font-size:12px;opacity:.9}
.ex-door-no{font-size:11px;opacity:.7}
.ex-door.hidden-door{background:linear-gradient(#4a4458,#24202e);border-color:#9a8fb0}
.ex-door.hidden-door strong{color:#d8d0ea}
.ex-stage.scene{background-size:cover;background-position:center}
.ex-stage.scene.talk{justify-content:space-between;min-height:270px}
.ex-stage.scene.talk .ex-quiz-q{font-size:16px}
.ex-stage.scene .ex-quiz-q{padding:8px 12px;border-radius:12px;background:rgba(27,12,64,.62);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.ex-stage.scene .ex-foe-name{padding:0 12px;border-radius:999px;background:rgba(27,12,64,.55)}
.ex-orig{width:62%;max-width:240px;height:auto;border-radius:10px;border:3px solid #ffd75e}
.ex-guest{height:110px;width:auto;max-width:60%;object-fit:contain;filter:drop-shadow(0 0 8px rgba(255,255,255,.7))}
.ex-foe-row{display:flex;gap:8px;justify-content:center;width:100%}
.ex-foe-card{flex:1;max-width:170px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:12px;background:rgba(27,12,64,.45);border:3px solid transparent;color:#fff;font-size:12px}
.ex-foe-card.target{border-color:#ffd75e;background:rgba(27,12,64,.7)}
.ex-foe-card.dead{opacity:.35;filter:grayscale(1)}
.ex-foe.small{height:96px}
.ex-maze{width:100%;max-width:330px;height:auto;aspect-ratio:1;border-radius:10px;border:3px solid #ffd75e;touch-action:none;background:#1b0c40}
.ex-maze-time{font-family:var(--display);font-size:17px;color:#ffd75e;font-variant-numeric:tabular-nums}
.ex-maze-time.hurry{color:#ff6b6b}
.ex-pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-areas:". up ." "left . right" ". down .";gap:6px;justify-content:center}
.ex-pad button{height:56px;border-radius:14px;background:#5b2fb5;border-bottom:4px solid #2a1460;color:#fff;font-size:22px}
.ex-pad-up{grid-area:up}.ex-pad-left{grid-area:left}.ex-pad-right{grid-area:right}.ex-pad-down{grid-area:down}
.ex-status{display:flex;flex-wrap:wrap;gap:4px;margin:0 -16px;padding:6px 16px;background:#3a0f2e;font-size:12px;color:#ffc2d6}
.ex-status span{padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.12)}
/* 전투 효과 */
.ex-stage{position:relative}
.ex-foe-wrap{position:relative;display:inline-flex}
.ex-foe-wrap.dead,.ex-foe-card.dead .ex-foe{animation:fx-die .5s ease-out forwards}
.ex-foe-card,.ex-run-mate{position:relative}
.ex-bar b{transition:width .35s ease-out}
.ex-cmds.busy{pointer-events:none}
.ex-cmds.busy .ex-cmd{filter:saturate(.6) brightness(.9)}
.fx-num{position:absolute;top:30%;z-index:6;transform:translateX(-50%);font-family:var(--display);font-size:28px;line-height:1;color:#fff;pointer-events:none;
  text-shadow:2px 0 0 #b3123c,-2px 0 0 #b3123c,0 2px 0 #b3123c,0 -2px 0 #b3123c,2px 2px 0 #b3123c,-2px -2px 0 #b3123c,2px -2px 0 #b3123c,-2px 2px 0 #b3123c;
  animation:fx-rise .85s ease-out forwards}
.fx-num.fire{color:#ffe14d;font-size:32px}
.fx-num.hurt{top:10%;font-size:22px;color:#ff4d6d;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff}
.fx-num.heal{top:10%;font-size:20px;color:#2fb34a;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff}
.fx-num.mana{top:34%;font-size:18px;color:#2f7fe0;text-shadow:2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff}
.fx-burst{position:absolute;inset:0;z-index:5;pointer-events:none}
.fx-burst.slash{background:linear-gradient(135deg,transparent 44%,rgba(255,255,255,.95) 48%,#fff 50%,rgba(255,255,255,.95) 52%,transparent 56%);animation:fx-slash .35s ease-out forwards}
.fx-burst.fire{background:radial-gradient(circle at 50% 55%,rgba(255,250,200,.95) 0,rgba(255,170,40,.85) 22%,rgba(255,70,20,.55) 42%,transparent 62%);animation:fx-fire .45s ease-out forwards}
.fx-burst.shield{border-radius:12px;box-shadow:inset 0 0 0 3px #6fd0ff,0 0 14px 4px rgba(90,190,255,.8);animation:fx-fade .7s ease-out forwards}
.fx-burst.heal{border-radius:12px;background:radial-gradient(circle,rgba(130,255,150,.55),transparent 70%);box-shadow:0 0 14px 4px rgba(90,230,120,.7);animation:fx-fade .7s ease-out forwards}
.fx-burst.sweep{background:radial-gradient(circle,rgba(255,40,60,.15),rgba(160,0,30,.6));animation:fx-fade .6s ease-out forwards}
.fx-hit{animation:fx-hit .4s ease-out}
.fx-hurt{animation:fx-hurt .4s ease-out}
.fx-hop{animation:fx-hop .3s ease-out}
.fx-lunge{animation:fx-lunge .4s ease-in-out}
@keyframes fx-rise{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-48px) scale(1)}}
@keyframes fx-slash{0%{opacity:0;transform:translate(-30%,-30%) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(25%,25%) scale(1.1)}}
@keyframes fx-fire{0%{opacity:0;transform:scale(.3)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}
@keyframes fx-fade{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

};

  const low = lowest(pet);
  const nextGoal = pet.stage === 0 ? GROWTH.stage1 : pet.stage === 1 ? GROWTH.stage2 : GROWTH.ending;
  const prevGoal = pet.stage === 0 ? 0 : pet.stage === 1 ? GROWTH.stage1 : GROWTH.stage2;
  const nextName = pet.stage === 0 ? '1차성장' : pet.stage === 1 ? '2차성장' : '엔딩 도전';
  const growth = el('div', 'growth');
  const gl = el('div', 'growth-label');
  gl.append(el('span', null, `다음: ${nextName} (네 지수 모두 ${nextGoal})`), el('span', null, `가장 낮은 지수 ${low}`));
  const gm = el('div', 'meter');
  const gb = el('b');
  gb.style.width = Math.max(0, Math.min(100, (low - prevGoal) / (nextGoal - prevGoal) * 100)) + '%';
  gm.append(gb);
  growth.append(gl, gm);

  const stats = el('div', 'stats');
  STATS.forEach(s => {
    const v = pet.stats[s.k];
    const w = el('div', 'stat' + (v < nextGoal ? ' short' : ''));

    const top = el('div', 'stat-top');
    top.append(el('strong', null, s.name + '지수'), el('span', null, `${v}`));
    const m = el('div', 'meter');

      : `${d.symptom}. 동물병원 진료실에서 진료를 받아보세요. 내버려 두면 점점 심해져요.`));
    const go = el('button', 'btn', '동물병원 가기');

  const noCare = S.careLeft <= 0;

    b.disabled = noCare;
    b.addEventListener('click', () => doPlay(play));
    opts.append(b);
  });
  wish.append(opts);
  root.append(wish);

  const acts = el('div', 'actions three');
  ACTIONS.forEach(act => {
    const btn = el('button', 'act');
    btn.append(document.createTextNode(act.name), el('small', null, act.hint));

    const b = el('button', 'sched');

    b.addEventListener('click', () => confirmSchedule(s));
    sch.append(b);
  });

  const chat = el('form', 'chat');

  }
}

  const pet = S.pet;

    save();
    openModal(box => {
      box.append(el('h3', null, `${STAGE_NAMES[next]}!`));

function advancePeriod() {

    c.period = 0;
    c.month = c.month === 12 ? 1 : c.month + 1;
    if (c.month === 3) c.year += 1;
  }
  S.careLeft = CARE_PER_PERIOD;
  const news = [];
  const pet = S.pet;
  if (pet) {
    pet.periods = (pet.periods || 0) + 1;
    const f = fatigueNow(pet);
    if (pet.sick) {
      const d = DISEASE_BY_ID[pet.sick.id];
      const hurt = Object.fromEntries(Object.entries(d.hurt).map(([k, v]) => [k, v * pet.sick.sev]));
      applyGain(hurt);
      setFatigue(pet, f + (d.tire || 0) * pet.sick.sev);
      const lost = STATS.filter(x => hurt[x.k]).map(x => `${x.name} ${hurt[x.k]}`).join(' ');
      if (pet.sick.sev < SEVERE.level) pet.sick.sev += 1;
      news.push(pet.sick.sev >= SEVERE.level
        ? `${josa(pet.name, '이', '가')} 아파서 ${lost ? `지수가 깎였어요(${lost})` : '피로가 더 쌓였어요'}. 결국 중병이 됐어요! 당장 입원해야 해요.`
        : `${josa(pet.name, '이', '가')} 아파서 ${lost ? `지수가 깎였어요(${lost})` : '피로가 더 쌓였어요'}. 병이 '${SEVERITY[pet.sick.sev]}' 단계가 됐어요. 병원에 데려가 주세요.`);
      pet.lastLine = d.line;
    } else {
      setFatigue(pet, f + FATIGUE.perPeriod);
      if (Math.random() < illnessChance(f)) {
        const d = pick(DISEASES);
        pet.sick = { id: d.id, sev: 1, known: false };
        pet.lastLine = d.line;
        news.push(`${josa(pet.name, '이', '가')} 병에 걸렸어요! ${d.symptom}. 동물병원에서 진료를 받아보세요.`);
      }
    }
  }
  return { festival, news };
}

function confirmSchedule(s) {
  const pet = S.pet;
  if (pet.sick && s.id !== 'rest') {
    say(DISEASE_BY_ID[pet.sick.id].line);
    toast('아픈 동안에는 푹 쉬기만 할 수 있어요. 동물병원에 데려가 주세요');
    return;
  }
  if ((s.fatigue > 0 || s.school) && fatigueNow(pet) >= FATIGUE.max) {
    say('너무 피곤해요... 오늘은 쉬고 싶어요');
    toast('피로지수가 가득 찼어요. 쉬기나 여행으로 피로를 풀어주세요');
    return;
  }
  if (s.school) {
    townView = 'school';
    schoolView = 'hub';
    return showTab('town');
  }
  if (s.travel) {
    townView = 'travel';
    travelPlan = { spot: null, ride: 1, stay: 5 };
    return showTab('town');
  }
  openModal(box => {
    box.append(el('h3', null, s.name), el('p', null, `${dateText(S.calendar)} 일주일 동안 ${s.name}에서 지내요.`));
    box.append(el('p', null, `${s.desc}${s.cost ? ` · ${s.cost}P` : ''}`));
    if (S.careLeft > 0) box.append(el('p', 'warn', `이번 주 돌봐주기가 ${S.careLeft}번 남았어요. 그래도 넘어갈까요?`));
    const row = el('div', 'modal-actions');
    const no = el('button', 'btn ghost', '다시 고를래');
    no.addEventListener('click', closeModal);
    const yes = el('button', 'btn', '보내기');
    yes.addEventListener('click', () => runSchedule(s));
    row.append(no, yes);
    box.append(row);
  });
}

function runSchedule(s) {
  endPeriod({ id: s.id, title: `${s.name} 끝!`, cost: s.cost, earn: s.earn, gain: s.gain, fatigue: s.fatigue, effort: s.effort, line: s.line });
}

// 한 주를 보내는 공통 처리(일정·여행). decorate(box) 로 결과 창 위쪽에 그림 등을 넣는다.
function endPeriod({ id, title, cost = 0, earn = 0, gain, fatigue, effort = 0, line, decorate, extra = [], after }) {
  const pet = S.pet;
  if (S.points < cost) return;
  const tired = (fatigue > 0 && fatigueNow(pet) >= FATIGUE.tiredAt) || !!pet.sick;
  const g = tired ? halveGain(gain) : gain;
  S.points += earn - cost;
  applyGain(g);
  setFatigue(pet, fatigueNow(pet) + fatigue);
  pet.effort = (pet.effort || 0) + effort;
  pet.activities = pet.activities || {};
  pet.activities[id] = (pet.activities[id] || 0) + 1;
  pet.lastLine = tired ? `피곤해서 힘들었어요... ${line}` : line;
  if (after) after();
  const { festival, news } = advancePeriod();
  const revealed = S.recipeKnown.length ? revealRecipe() : null;
  save();
  renderPoints();
  openModal(box => {
    box.append(el('h3', null, title));
    if (decorate) decorate(box);
    const parts = [gainText(g), earn ? `포인트 +${earn}` : '', fatigue < 0 ? `피로 ${fatigue}` : `피로 +${fatigue}`].filter(Boolean);
    box.append(el('p', null, parts.join(' · ')));
    extra.forEach(t => box.append(el('p', null, t)));
    if (tired && Object.keys(gain).length) box.append(el('p', 'warn', '피곤하거나 아파서 효과가 반으로 줄었어요.'));
    box.append(el('p', 'next-date', `일주일이 지나 ${dateText(S.calendar)}가 됐어요.`));
    if (revealed) box.append(el('p', null, `쿠킹샵 요리 비법서에 새 요리법이 공개됐어요: ${FOOD_BY_ID[revealed.result].name}`));
    news.forEach(t => box.append(el('p', 'warn', t)));
    const ok = el('button', 'btn', '확인');
    ok.addEventListener('click', () => {
      closeModal();
      pendingFestival = festival;
      showTab('farm');
      if (severeLock) return;
      pendingFestival = false;
      checkGrowth();
      if (festival) setTimeout(harvestFestival, 50);
    });
    box.append(ok);
  });
}

// 수확제(9월 4주차가 끝날 때): 가장 자신 있는 지수로 대회에 나간다. 상금/순위 기준은 임시.
const CONTESTS = { love: '인기 대회', charm: '미인 대회', power: '씨름 대회', know: '퀴즈 대회' };
function harvestFestival() {
  const pet = S.pet;
  if (!pet) return;
  const best = STATS.reduce((a, b) => (pet.stats[b.k] > pet.stats[a.k] ? b : a));
  const v = pet.stats[best.k];
  const [rank, prize] = v >= 600 ? ['우승', 100] : v >= 400 ? ['준우승', 60] : v >= 250 ? ['3등', 30] : ['참가상', 10];
  S.points += prize;
  pet.effort = (pet.effort || 0) + 5;
  pet.activities = pet.activities || {};
  pet.activities.festival = (pet.activities.festival || 0) + 1;
  save();
  renderPoints();
  openModal(box => {
    box.append(el('h3', null, `${S.calendar.year}년째 수확제`));
    const img = el('img', 'big-sprite');
    img.src = sprite(pet.slug, pet.stage, true);
    img.alt = '';
    box.append(img, el('p', null, `${josa(pet.name, '이', '가')} ${CONTESTS[best.k]}에 나가서 ${rank}을 했어요! (${best.name}지수 ${v})`));
    box.append(el('p', null, `상금 ${prize}P`));
    const ok = el('button', 'btn', '좋아!');
    ok.addEventListener('click', () => { closeModal(); renderFarm(); });
    box.append(ok);
  });
}
function ensureWish(pet) {
  if (pet.wish && PLAYS.some(p => p.id === pet.wish.want)) return;
  const opts = [...PLAYS].sort(() => Math.random() - .5).slice(0, 2);
  pet.wish = { options: opts.map(p => p.id), want: pick(opts).id };
  save();
}
const halveGain = g => Object.fromEntries(Object.entries(g).map(([k, v]) => [k, v > 0 ? Math.ceil(v / 2) : v]));
const doubleGain = g => Object.fromEntries(Object.entries(g).map(([k, v]) => [k, v * 2]));

function perform({ gain, fatigue = 0, line, after }) {
  if (S.careLeft <= 0) {
    toast('이번 주에는 더 돌봐줄 수 없어요. 일정을 정해 다음 주로 넘어가세요');
    return;
  }
  const pet = S.pet;
  const f = fatigueNow(pet);
  if (fatigue > 0 && f >= FATIGUE.max) {
    say('너무 피곤해요... 좀 쉬게 해주세요');
    toast('피로지수가 가득 찼어요. 쉬게 해주세요');
    return;
  }
  const tired = (fatigue > 0 && f >= FATIGUE.tiredAt) || !!pet.sick;
  const g = tired ? halveGain(gain) : gain;
  S.careLeft -= 1;
  applyGain(g);
  setFatigue(pet, f + fatigue);
  S.points += 2;
  pet.lastLine = tired ? `피곤해요... ${line}` : line;
  if (after) after();
  save();
  renderPoints();
  renderFarm();
  hop();
  showPose();
  if (gainText(g)) floatText(gainText(g));
  checkGrowth();
}

function feedFood(f) {
  if (!S.pet || f.id === FOOD.bad.id || (S.foodBag[f.id] || 0) < 1) return;
  if (S.careLeft <= 0) return toast('이번 주에는 더 돌봐줄 수 없어요. 일정을 정해 다음 주로 넘어가세요');
  S.foodBag[f.id] -= 1;
  perform({
    gain: f.gain,
    fatigue: f.fatigue != null ? f.fatigue : -3,
    line: f.id === 'badsoup' ? '으... 배 아파요...' : `${f.name}! 정말 맛있어요!`,
  });
}

function doAction(act) {
  const foods = act.id === 'feed' ? ownedFoods().filter(f => f.id !== FOOD.bad.id) : [];
  if (!foods.length) return perform({ gain: act.gain, fatigue: act.fatigue, line: pick(act.lines) });
  // 쿠킹샵에서 만든 음식이 있으면 무엇을 먹일지 고른다
  openModal(box => {
    box.append(el('h3', null, '무엇을 먹일까요?'));
    const grid = el('div', 'food-grid pick');
    const basic = el('button', 'food-card');
    basic.append(el('strong', null, '기본 사료'), el('small', null, gainText(act.gain)));
    basic.addEventListener('click', () => { closeModal(); perform({ gain: act.gain, fatigue: act.fatigue, line: pick(act.lines) }); });
    grid.append(basic);
    foods.forEach(f => {
      const b = el('button', 'food-card');
      const img = el('img');
      img.src = foodImg(f.id);
      img.alt = '';
      b.append(img, el('strong', null, f.name), el('small', null, f.id === 'badsoup' ? '배탈 날지도…' : `${gainText(f.gain)} · ${f.count}개`));
      b.addEventListener('click', () => { closeModal(); feedFood(f); });
      grid.append(b);
    });
    box.append(grid);
    const close = el('button', 'btn ghost', '닫기');
    close.addEventListener('click', closeModal);
    box.append(close);
  });
}

function doPlay(play) {
  const pet = S.pet;
  const wished = pet.wish && pet.wish.want === play.id;
  perform({
    gain: wished ? doubleGain(play.gain) : play.gain,
    fatigue: PLAY_FATIGUE,
    line: wished ? `와! 정말 하고 싶었어요! ${play.line}` : play.line,
    after: () => { pet.wish = null; },
  });
}

// ===== 욕설 필터 (메이플 수준: 흔한 욕설·비하·성적 표현 + 초성/숫자/띄어쓰기 변형) =====
// 공백·숫자·기호를 지우고 비교한다. 동물 게임에서 흔한 멀쩡한 말(젖소, 시바견, 보지 마 등)은 먼저 지운다.
const BAD_ALLOW = ['젖소', '시바견', '시바이누', '보지마', '보지않', '자지마', '자지않', '새끼손가락', '새끼고양이', '새끼강아지', '미친듯이'];
const BAD_WORDS = [
  '시발', '씨발', '씨바', '씨빨', '시빨', '씨팔', '시팔', '쓰벌', '쓰발', '씌발', '썅', '샹년', '시바', '싸발',
  '개새', '개색', '개세끼', '개쌔', '개섀', '새끼야', '섀끼', '쌔끼', '씨새', '개같', '개소리', '개년', '개놈',
  '병신', '븅신', '빙신', '병쉰', '등신', '미친놈', '미친년', '미친새', '미친개', '미친', '또라이', '돌아이', '찐따', '애자',
  '존나', '졸라', '존니', '좆', '좃', '조까', '좆까', '지랄', '염병', '엠창', '니미', '느금', '니애미', '니엄마', '느개비', '애미', '애비',
  '꺼져', '닥쳐', '닥치', '엿먹', '뒤져', '뒈져', '디져', '죽어라', '죽여', '쓰레기', '걸레', '창녀', '창놈', '화냥',
  '한남', '한녀', '김치녀', '틀딱', '급식충', '맘충', '노인충', '장애새', '정신병자',
  '섹스', '쎅스', '야동', '자지', '보지', '젖꼭지', '젖탱', '강간', '성폭', '딸딸', '자위', '오르가즘', '창년',
  'fuck', 'fck', 'shit', 'bitch', 'asshole', 'dick', 'pussy', 'porn', 'sex', 'nigger', 'nigga', 'cunt', 'bastard',
];
const BAD_CHOSEONG = ['ㅅㅂ', 'ㅆㅂ', 'ㅅㅃ', 'ㅂㅅ', 'ㅄ', 'ㅈㄹ', 'ㅈㄴ', 'ㅁㅊ', 'ㄱㅅㄲ', 'ㅅㄲ', 'ㄲㅈ', 'ㄷㅊ', 'ㅗㅗ', 'ㅈㄲ', 'ㅆㄹㄱ'];
function hasBadWord(text) {
  let t = String(text).toLowerCase().replace(/[^가-힣ㄱ-ㅎㅏ-ㅣa-z]/g, '');
  BAD_ALLOW.forEach(w => { t = t.split(w).join(''); });
  return BAD_WORDS.some(w => t.includes(w)) || BAD_CHOSEONG.some(w => t.includes(w));
}

function chatReply(text) {
  const pet = S.pet;
  if (hasBadWord(text)) {
    applyGain({ love: -1 });
    say(pick(['그런 말은 싫어요... 흑', '주인님 무서워요...', '나쁜 말 하지 마세요!']));
    floatText('애정-1');
    hop();
    save();
    return;
  }
  let reply = null;
  let gain = null;
  const taught = (pet.taught || []).find(t => text.includes(t.q));
  if (taught) reply = taught.a;
  else for (const [re, lines, g] of CHAT_RULES) {
    if (re.test(text)) { reply = pick(lines); gain = g; break; }
  }
  reply = (reply || pick(CHAT_DEFAULT)).replace('{name}', pet.name);
  const periodKey = dateText(S.calendar);
  if (gain && pet.chatAt !== periodKey) {
    pet.chatAt = periodKey;
    applyGain(gain);
    floatText(gainText(gain));
  }
  say(reply);
  hop();
  save();
}

function tryEnding() {
  const pet = S.pet;
  const joins = !S.gameCleared;
  openModal(box => {
    box.append(el('h3', null, '엔딩 도전'));
    const img = el('img', 'big-sprite');
    img.src = sprite(pet.slug, 2);
    img.alt = '';
    box.append(img, el('p', null, joins
      ? `${josa(pet.name, '이', '가')} 사람이 될 준비가 됐어요. 사람이 되면 탐험을 함께할 동료가 되고, ${josa(ANIMAL_BY_SLUG[pet.slug].name, '은', '는')} 다시 분양받을 수 없어요. 지금 능력치로 평가가 확정돼요.`
      : `${josa(pet.name, '이', '가')} 사람이 될 준비가 됐어요. 평가 점수는 동물수첩에 기록돼요.`));
    const row = el('div', 'modal-actions');
    const no = el('button', 'btn ghost', '조금 더 키울래');
    no.addEventListener('click', closeModal);
    const yes = el('button', 'btn', '사람이 되기');
    yes.addEventListener('click', () => finishEnding(joins));
    row.append(no, yes);
    box.append(row);
  });
}

function finishEnding(joins) {
  const pet = S.pet;
  const effort = pet.effort || 0;
  const base = statTotal(pet.stats);
  const score = base + effort * SCORE.effortWeight;
  const grade = gradeFor(score);
  const d = dexEntry(pet.slug);
  d.ended += 1;
  d.bestScore = Math.max(d.bestScore, score);
  if (joins) {
    S.companions.push({ slug: pet.slug, name: pet.name, stats: { ...pet.stats }, effort, score, grade, at: Date.now() });
    if (S.party.length < PARTY_SIZE) S.party.push(pet.slug);
  }
  S.points += 100;
  S.pet = null;
  save();
  renderPoints();
  openModal(box => {
    box.append(el('h3', null, `평가 ${grade}`));
    const tbl = el('div', 'score-table');
    [['능력치 합계', base], [`노력 점수 ×${SCORE.effortWeight}`, effort * SCORE.effortWeight], ['총점', score]].forEach(([k, v]) => {
      const r = el('div');
      r.append(el('span', null, k), el('strong', null, String(v)));
      tbl.append(r);
    });
    box.append(tbl, el('p', null, joins
      ? `${josa(pet.name, '이', '가')} 사람이 되어 동료로 합류했어요! (사람 모습 그림은 준비 중)`
      : `${josa(pet.name, '이', '가')} 사람이 되었어요.`));
    const ok = el('button', 'btn', '확인');
    ok.addEventListener('click', () => { closeModal(); renderFarm(); });
    box.append(ok);
  });
}

// ===== 꾸미기(실외 마당) =====
let wanderTimer = null;
let yardEdit = false;
let yardSel = null;
const placedCount = id => S.yard.items.filter(i => i.id === id).length;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function renderYard() {
  const root = $('screen-yard');
  root.replaceChildren();
  clearInterval(wanderTimer);
  const Y = S.yard;

  const stage = el('div', 'stage yard' + (yardEdit ? ' editing' : ''));
  stage.style.backgroundImage = `url("${skinImg(Y.skin)}")`;
  Y.items.forEach(it => stage.append(decoNode(it, stage)));

  if (S.pet) {
    const p = el('img', 'yard-pet');
    p.src = sprite(S.pet.slug, S.pet.stage);
    p.alt = S.pet.name;
    p.style.width = (135 / SKIN_W * 100) + '%';
    const place = (x, y) => { p.style.left = x + '%'; p.style.top = y + '%'; p.style.zIndex = Math.round(y * 10); };
    place(50, 88);
    p.addEventListener('click', () => {
      if (yardEdit) return;
      p.src = sprite(S.pet.slug, S.pet.stage, true);
      setTimeout(() => { p.src = sprite(S.pet.slug, S.pet.stage); }, 1200);
    });
    stage.append(p);
    wanderTimer = setInterval(() => {
      if (currentTab !== 'yard' || yardEdit) return;
      place(12 + Math.random() * 76, 62 + Math.random() * 32);
    }, 2600);
  }
  root.append(stage);

  const head = el('div', 'yard-head');
  head.append(el('h2', 'section-title', yardEdit ? '농장 꾸미는 중' : '우리 농장 마당'));

  editBtn.addEventListener('click', () => { yardEdit = !yardEdit; yardSel = null; save(); renderYard(); });
  head.append(editBtn);
  root.append(head);

    root.append(el('p', 'note', S.pet
      ? `${josa(S.pet.name, '이', '가')} 마당에서 놀고 있어요. 마을 아이템 가게에서 꾸미기 아이템을 사서 농장을 꾸며보세요.`
      : '마을 아이템 가게에서 꾸미기 아이템을 사서 농장을 꾸며보세요.'));

  }

  const sel = Y.items.find(i => i.uid === yardSel);
  if (sel) {
    const row = el('div', 'sel-row');

    const del = el('button', 'btn ghost', '치우기');
    del.addEventListener('click', () => {
      Y.items = Y.items.filter(i => i.uid !== sel.uid);
      yardSel = null;

function decoNode(it, stage) {
  const img = el('img', 'deco' + (yardEdit && it.uid === yardSel ? ' sel' : ''));
  img.src = decoImg(it.id);
  img.alt = DECO_BY_ID[it.id] ? DECO_BY_ID[it.id].name : '';
  img.draggable = false;
  const pos = () => { img.style.left = it.x + '%'; img.style.top = it.y + '%'; img.style.zIndex = Math.round(it.y * 10); };
  pos();
  img.addEventListener('load', () => { img.style.width = (img.naturalWidth / SKIN_W * 100) + '%'; });
  if (!yardEdit) return img;
  img.addEventListener('pointerdown', e => {
    e.preventDefault();
    yardSel = it.uid;
    stage.querySelectorAll('.deco.sel').forEach(n => n.classList.remove('sel'));
    img.classList.add('sel');
    img.setPointerCapture(e.pointerId);
    const r = stage.getBoundingClientRect();
    const dx = (e.clientX - r.left) / r.width * 100 - it.x;
    const dy = (e.clientY - r.top) / r.height * 100 - it.y;
    const move = ev => {
      it.x = clamp((ev.clientX - r.left) / r.width * 100 - dx, 0, 100);
      it.y = clamp((ev.clientY - r.top) / r.height * 100 - dy, 8, 100);
      pos();
    };
    const up = () => {
      img.removeEventListener('pointermove', move);
      save();
      renderYard();
    };
    img.addEventListener('pointermove', move);
    img.addEventListener('pointerup', up, { once: true });
    img.addEventListener('pointercancel', up, { once: true });
  });
  return img;
}

const TRAVEL_IMG = 'assets/ui/travel/';
function travelCalc(plan) {
  const spot = TRAVEL_SPOTS.find(s => s.id === plan.spot);
  const ride = TRAVEL_RIDES.find(r => r.id === plan.ride);
  const stay = TRAVEL_STAYS.find(s => s.id === plan.stay);
  const d = TRAVEL_DAYS;
  const nights = d - 1;
  const gain = {};
  const add = (g, n) => Object.entries(g).forEach(([k, v]) => { gain[k] = (gain[k] || 0) + v * n; });
  add(spot.perDay, d);
  add(ride.gain, 1);
  add(stay.gain, nights);
  return {
    spot, ride, stay, d, gain,
    fatigue: spot.fatigue * d + ride.fatigue + stay.fatigue * nights,
    cost: spot.price + ride.cost + stay.cost * nights,
    effort: 2 + d,
    souvenirs: d >= 4 ? 2 : d >= 2 ? 1 : 0,
  };
}

// ===== 쿠킹샵 (원작: 재료 2가지를 골라 요리) =====
const FOOD = window.FOOD_DATA || { foods: [], recipes: [], bad: { id: 'badsoup', name: '먹을 수 없는 요리', gain: {}, fatigue: 10 } };
const FOOD_BY_ID = Object.fromEntries([...FOOD.foods, FOOD.bad].map(f => [f.id, f]));
const foodImg = id => asset(`assets/food/${id}.gif`);
const BASE_FOODS = FOOD.foods.filter(f => f.tier === 1);
const recipeFor = (a, b) => FOOD.recipes.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a));
let cookSlots = [null, null];
let cookResult = null; // 'ok' | 'fail' | null

// 비법서는 처음에 3개, 주가 지날 때마다 1개씩 '살짝 공개'. 만들 수 있는 것부터 공개한다.
function revealRecipe() {
  const known = new Set(S.recipeKnown);
  const makeable = id => FOOD_BY_ID[id] && (FOOD_BY_ID[id].tier === 1 || FOOD.recipes.some(r => known.has(r.id) && r.result === id));
  const cand = FOOD.recipes.filter(r => !known.has(r.id) && makeable(r.a) && makeable(r.b));
  const pickFrom = cand.length ? cand : FOOD.recipes.filter(r => !known.has(r.id));
  if (!pickFrom.length) return null;
  const r = pick(pickFrom);
  S.recipeKnown.push(r.id);
  return r;
}
function ensureRecipeBook() {
  if (!FOOD.recipes.length || S.recipeKnown.length) return;
  for (let i = 0; i < 3; i++) revealRecipe();
  save();
}

function renderCook(root) {
  ensureRecipeBook();
  const back = el('button', 'back-btn', '← 마을');

  const banner = el('img', 'cook-banner');

  banner.alt = cookResult === 'ok' ? '어때요? 완성된 요리가 맘에 드나요?' : cookResult === 'fail' ? '도저히 먹을 수 없는 요리가 나와버렸네요' : '먼저 재료 2가지를 고른 후 맛있는 요리를 만들어 보세요';
  root.append(banner);

  const board = el('div', 'cook-board');
  cookSlots.forEach((id, i) => {

    if (id) {
      const f = el('img', 'bowl-food');

  });

  cookBtn.addEventListener('click', doCook);

  bimg.src = 'assets/ui/cook/img_mini05.gif';

function ownedFoods() {
  return Object.entries(S.foodBag).filter(([id, n]) => n > 0 && FOOD_BY_ID[id]).map(([id, n]) => ({ ...FOOD_BY_ID[id], count: n }));
}

function pickIngredient(slot) {
  const other = cookSlots[1 - slot];
  const list = ownedFoods().filter(f => f.id !== 'badsoup' && (f.id !== other || f.count > 1));
  openModal(box => {
    box.append(el('h3', null, '원하는 재료를 클릭하세요'));
    if (!list.length) {
      box.append(el('p', null, '가진 재료가 없어요. 아래 재료 가게에서 사 오세요.'));
    } else {
      const grid = el('div', 'food-grid pick');
      list.forEach(f => {
        const b = el('button', 'food-card');
        const img = el('img');
        img.src = foodImg(f.id);
        img.alt = '';
        b.append(img, el('strong', null, f.name), el('small', null, `${f.count}개`));
        b.addEventListener('click', () => { cookSlots[slot] = f.id; cookResult = null; closeModal(); renderTown(); });
        grid.append(b);
      });
      box.append(grid);
    }
    const close = el('button', 'btn ghost', '닫기');
    close.addEventListener('click', closeModal);
    box.append(close);
  });
}

function doCook() {
  const [a, b] = cookSlots;
  if (!a || !b) return;
  if ((S.foodBag[a] || 0) < 1 || (S.foodBag[b] || 0) < (a === b ? 2 : 1)) return toast('재료가 모자라요');
  S.foodBag[a] -= 1;
  S.foodBag[b] -= 1;
  const r = recipeFor(a, b);
  const resultId = r ? r.result : FOOD.bad.id;
  S.foodBag[resultId] = (S.foodBag[resultId] || 0) + 1;
  const isNew = r && !S.recipeKnown.includes(r.id);
  if (isNew) S.recipeKnown.push(r.id);
  cookResult = r ? 'ok' : 'fail';
  cookSlots = [null, null];
  save();
  renderTown();
  openModal(box => {
    box.append(el('h3', null, r ? '요리 완성!' : '앗, 실패...'));
    const img = el('img', 'cook-result');
    img.src = foodImg(resultId);
    img.alt = '';
    box.append(img, el('p', null, `${josa(FOOD_BY_ID[resultId].name, '이', '가')} ${r ? `완성됐어요. ${gainText(FOOD_BY_ID[resultId].gain)}` : '나와버렸어요 T.T'}`));
    if (isNew) box.append(el('p', 'next-date', '새로운 요리법을 알아냈어요! 비법서에 적어둘게요.'));
    box.append(el('p', null, '음식 아이템은 키우기의 음식주기로 먹일 수 있어요.'));
    const ok = el('button', 'btn', '확인');
    ok.addEventListener('click', closeModal);
    box.append(ok);
  });
}

function openRecipeBook() {
  const known = FOOD.recipes.filter(r => S.recipeKnown.includes(r.id));
  openModal(box => {
    box.append(el('h3', null, '요리 비법서'));
    box.append(el('p', null, `알아낸 요리법 ${known.length} / ${FOOD.recipes.length}`));
    const list = el('div', 'recipe-list');
    known.forEach(r => {
      const row = el('div', 'recipe-row');
      [r.a, '+', r.b, '=', r.result].forEach(x => {
        if (x === '+' || x === '=') return row.append(el('span', 'op', x));
        const c = el('div', 'r-item');
        const img = el('img');
        img.src = foodImg(x);
        img.alt = '';

}

// ===== 분양소 =====
function renderAdopt(root) {
  root.append(el('h2', 'section-title', '분양소'));
  root.lastChild.append(el('span', null, '함께 지낼 동물을 골라주세요'));
  const grid = el('div', 'grid');
  ANIMALS.forEach(a => {
    const locked = adoptLocked(a.slug);
    const t = el('button', 'tile' + (locked ? ' taken' : ''));
    const img = el('img');
    img.src = sprite(a.slug, 0);
    img.alt = '';
    img.loading = 'lazy';
    t.append(img, el('span', null, a.name));
    if (locked) t.append(el('span', 'done', '사람이 됨'));
    t.addEventListener('click', () => locked
      ? toast(`${josa(a.name, '은', '는')} 이미 사람이 되어 동료가 됐어요`)
      : confirmAdopt(a));
    grid.append(t);
  });
  root.append(grid);
}

function confirmAdopt(a) {
  openModal(box => {
    box.append(el('h3', null, a.name));
    const st = el('div', 'stages');
    STAGE_NAMES.forEach((n, i) => {
      const f = el('figure');
      const img = el('img');
      img.src = sprite(a.slug, i);
      img.alt = '';
      f.append(img, el('figcaption', null, n));
      st.append(f);
    });
    box.append(st, el('p', null, '이름을 지어주세요'));
    const input = el('input', 'name-input');
    input.maxLength = 10;
    input.value = '꼬마' + a.name.replace('크리스마스 ', '');
    input.setAttribute('aria-label', '동물 이름');
    box.append(input);
    const row = el('div', 'modal-actions');
    const no = el('button', 'btn ghost', '다시 고를래');
    no.addEventListener('click', closeModal);
    const yes = el('button', 'btn', '분양받기');
    yes.addEventListener('click', () => {
      const name = input.value.trim() || a.name;
      if (hasBadWord(name)) return toast('그 이름은 쓸 수 없어요. 다른 이름을 지어 주세요');
      S.pet = { slug: a.slug, name, stage: 0, stats: { love: 10, know: 10, charm: 10, power: 10 }, effort: 0, born: Date.now() };
      markSeen(a.slug, 0);
      S.careLeft = CARE_PER_PERIOD;
      save();
      closeModal();
      toast(`${josa(name, '과', '와')} 함께하게 됐어요!`);
      renderFarm();

    row.append(no, yes);
    box.append(row);

}

// ===== 아이템박스 (원작 탭: 꾸미기 / 음식 / 용품 / 약품) =====
// 아이템은 쿠킹샵·여행 기념품·아이템 가게 등에서 얻는다. 용품/약품은 연금술·병원·탐험이 생기면 채운다.
const ITEMBOX_TABS = [
  { id: 'food', img: 'food', empty: '쿠킹샵에서 요리하거나 여행 기념품으로 얻을 수 있어요.' },
  { id: 'deco', img: 'deco', empty: '마을의 아이템 가게에서 살 수 있어요.' },
  { id: 'goods', img: 'item', empty: '탐험의 마법 상인에게 사거나 북쪽 탑 몬스터를 물리치면 얻어요.' },
  { id: 'medicine', img: 'mad', empty: '마을 동물병원 약국에서 살 수 있어요.' },
];
let boxView = 'food';
function renderItemBox() {
  const root = $('screen-shop');
  root.replaceChildren();
  root.append(el('h2', 'section-title', '아이템박스'));
  const tabs = el('div', 'box-tabs');
  ITEMBOX_TABS.forEach(t => {
    const b = el('button');
    const img = el('img');
    img.src = `assets/ui/itembox/tab_itembox_${t.img}_${boxView === t.id ? 'on' : 'off'}.gif`;
    img.alt = { food: '음식', deco: '꾸미기', goods: '용품', medicine: '약품' }[t.id];
    b.append(img);
    b.setAttribute('aria-pressed', String(boxView === t.id));
    b.addEventListener('click', () => { boxView = t.id; renderItemBox(); });
    tabs.append(b);
  });
  root.append(tabs);
  const panel = el('div', 'box-panel');
  const tab = ITEMBOX_TABS.find(t => t.id === boxView);
  const cards = boxView === 'food' ? foodCards() : boxView === 'deco' ? decoCards() : boxView === 'medicine' ? medCards() : boxView === 'goods' ? goodsCards() : [];
  if (!cards.length) panel.append(el('p', 'note', `아직 없어요. ${tab.empty}`));
  else {
    const grid = el('div', 'food-grid');
    cards.forEach(c => grid.append(c));
    panel.append(grid);
  }
  root.append(panel);
}

function foodCards() {
  return ownedFoods().map(f => {
    const card = el('div', 'food-card');
    const img = el('img');
    img.src = foodImg(f.id);
    img.alt = '';
    const bad = f.id === FOOD.bad.id;
    const btn = el('button', null, bad ? '먹일 수 없어요' : '먹이기');
    btn.disabled = bad || !S.pet || S.careLeft <= 0;
    btn.addEventListener('click', () => { showTab('farm'); feedFood(f); });
    card.append(img, el('strong', null, f.name), el('small', null, `${bad ? '연금술 재료로 쓸 수 있어요' : gainText(f.gain)} · ${f.count}개`), btn);
    return card;
  });
}

function medCards() {
  return MEDICINES.filter(m => (S.medBag[m.id] || 0) > 0).map(m => {
    const card = el('div', 'food-card');
    const img = el('img');
    img.src = medImg(m.id);
    img.alt = '';
    const btn = el('button', null, '먹이기');
    btn.disabled = !S.pet;
    btn.addEventListener('click', () => giveMedicine(m));
    card.append(img, el('strong', null, m.name), el('small', null, `${m.tier}단계 · ${S.medBag[m.id]}개`), btn);
    return card;
  });
}

function giveMedicine(m) {
  const pet = S.pet;
  if (!pet || (S.medBag[m.id] || 0) < 1) return;
  if (!pet.sick) return toast(`${josa(pet.name, '은', '는')} 아프지 않아요`);
  if (pet.sick.sev >= SEVERE.level) return toast('중병은 약으로 나을 수 없어요. 입원해야 해요');
  const d = DISEASE_BY_ID[pet.sick.id];
  S.medBag[m.id] -= 1;
  let msg;
  if (m.fam !== d.med) {
    msg = pet.sick.known ? '이 병에는 맞지 않는 약이에요.' : '효과가 없었어요. 먼저 진료를 받아 처방을 알아보세요.';
  } else if (m.tier >= pet.sick.sev) {
    pet.sick = null;
    pet.lastLine = '이제 다 나았어요! 고마워요!';
    msg = `${josa(pet.name, '이', '가')} 다 나았어요!`;
  } else {
    pet.sick.sev = Math.max(1, pet.sick.sev - m.tier);
    pet.sick.known = true;
    msg = `조금 나아졌어요. 병이 '${SEVERITY[pet.sick.sev]}' 단계로 내려갔지만 아직 다 낫지는 않았어요.`;
  }
  save();
  openModal(box => {
    const img = el('img', 'cook-result');
    img.src = medImg(m.id);
    img.alt = '';
    box.append(el('h3', null, m.name), img, el('p', null, msg));
    const ok = el('button', 'btn', '확인');
    ok.addEventListener('click', () => { closeModal(); showTab(currentTab); });
    box.append(ok);
  });
}

function decoCards() {
  return DECO.filter(d => (S.decoBag[d.id] || 0) > 0).map(d => {
    const card = el('div', 'food-card');
    const img = el('img');
    img.src = decoIcon(d.id);
    img.alt = '';
    const have = S.decoBag[d.id];
    const placed = placedCount(d.id);
    const btn = el('button', null, '농장에 놓기');
    btn.disabled = placed >= have;
    btn.addEventListener('click', () => { yardEdit = true; yardSel = null; showTab('yard'); });
    card.append(img, el('strong', null, d.name), el('small', null, `${have}개 · 놓은 것 ${placed}`), btn);
    return card;
  });
}

// ===== 동물병원 (원작: 진료실 / 약국 / 입원실) =====
let hospitalView = 'clinic';
const HOSP_IMG = 'assets/ui/hospital/';
function renderHospital(root) {
  const back = el('button', 'back-btn', '← 마을');
  back.addEventListener('click', () => { townView = 'hub'; renderTown(); });
  root.append(back);
  const seg = el('div', 'seg');
  [['clinic', '진료실'], ['pharmacy', '약국'], ['ward', '입원실']].forEach(([id, label]) => {
    const b = el('button', null, label);
    b.setAttribute('aria-pressed', String(hospitalView === id));
    b.addEventListener('click', () => { hospitalView = id; renderTown(); });
    seg.append(b);
  });
  root.append(seg);
  const banner = el('img', 'cook-banner');
  banner.style.marginTop = '10px';
  banner.src = HOSP_IMG + { clinic: 'img_hospital02', pharmacy: 'img_hospital04', ward: 'img_hospital05' }[hospitalView] + '.gif';
  banner.alt = {
    clinic: '진료실',
    pharmacy: '약은 종류에 따라 가격이 다 틀려요. 먼저 진료를 받고 처방에 따라 약을 먹는 게 제일 좋다는 것 잊지 마세요.',
    ward: '아파서 병원에 입원한 동물환자예요',
  }[hospitalView];
  root.append(banner);
  const pet = S.pet;

  if (hospitalView === 'clinic') {
    const txt = el('img', 'hosp-txt');
    txt.src = HOSP_IMG + 'sub05_txt02.gif';
    txt.alt = '아픈 동물을 병원에 데려오세요. 의사선생님이 친절하게 진료해 주신답니다. 진료를 받으려면 20포인트가 필요해요.';
    root.append(txt);
    const go = el('button', 'cook-btn', `진료 받을래요 (${HOSPITAL.diagnose}P)`);
    go.disabled = !pet || S.points < HOSPITAL.diagnose;
    go.addEventListener('click', diagnose);
    root.append(go);
    if (pet && S.points < HOSPITAL.diagnose) root.append(noPointsImg());
    return;
  }

  if (hospitalView === 'pharmacy') {
    if (pet && pet.sick && pet.sick.known) {
      const d = DISEASE_BY_ID[pet.sick.id];
      root.append(el('p', 'rx', `처방전: ${d.name} (${SEVERITY[pet.sick.sev]}) → ${rxText(pet.sick)}`));
    }
    const grid = el('div', 'food-grid');
    MEDICINES.forEach(m => {
      const card = el('div', 'food-card');
      const img = el('img');
      img.src = medImg(m.id);
      img.alt = '';
      const have = S.medBag[m.id] || 0;
      const buy = el('button', null, `${m.price}P`);
      buy.disabled = S.points < m.price;
      buy.setAttribute('aria-label', `${m.name} ${m.price}포인트에 사기`);
      buy.addEventListener('click', () => {
        if (S.points < m.price) return;
        S.points -= m.price;
        S.medBag[m.id] = have + 1;
        save();
        renderPoints();
        toast(`${josa(m.name, '을', '를')} 샀어요. 아이템박스 약품에 들어갔어요`);
        renderTown();
      });
      card.append(img, el('strong', null, m.name), el('small', null, have ? `${m.tier}단계 · ${have}개` : `${m.tier}단계`), buy);
      grid.append(card);
    });
    root.append(grid);
    return;
  }

  root.append(el('p', 'note', `입원하면 일주일 동안 병원에서 지내요. 어떤 병이든 낫고 피로도 모두 풀려요. 비용 ${HOSPITAL.stay}P.`));
  const stay = el('button', 'cook-btn', `입원시키기 (${HOSPITAL.stay}P)`);
  stay.disabled = !pet || S.points < HOSPITAL.stay;
  stay.addEventListener('click', () => {
    if (!pet.sick && fatigueNow(pet) < FATIGUE.tiredAt) return toast(`${josa(pet.name, '은', '는')} 건강해서 입원할 필요가 없어요`);
    openModal(box => {
      box.append(el('h3', null, '입원'), el('p', null, `${josa(pet.name, '이', '가')} 일주일 동안 입원해요. 이번 주가 지나가요.`));
      const row = el('div', 'modal-actions');
      const no = el('button', 'btn ghost', '안 할래요');
      no.addEventListener('click', closeModal);
      const yes = el('button', 'btn', `${HOSPITAL.stay}P 내고 입원`);
      yes.addEventListener('click', () => {
        closeModal();
        townView = 'hub';
        endPeriod({
          id: 'hospital', title: '퇴원했어요!', cost: HOSPITAL.stay, gain: {}, fatigue: -FATIGUE.max,
          line: '이제 하나도 안 아파요!',
          after: () => { pet.sick = null; },
        });
      });
      row.append(no, yes);
      box.append(row);
    });
  });
  root.append(stay);
}

let severeLock = false;
let pendingFestival = false;
function severeHospital() {
  const pet = S.pet;
  if (!pet || !pet.sick || pet.sick.sev < SEVERE.level || !$('modal').hidden) return;
  const d = DISEASE_BY_ID[pet.sick.id];
  severeLock = true;
  openModal(box => {
    box.append(el('h3', null, '중병에 걸렸어요!'));
    const img = el('img', 'travel-img');
    img.src = HOSP_IMG + 'img_hospital05.gif';
    img.alt = '아파서 병원에 입원한 동물환자예요';
    box.append(img, el('p', null, `${d.name}이 너무 심해져서 중병이 됐어요. 약으로는 나을 수 없어서 지금 바로 동물병원에 입원해야 해요.`));
    box.append(el('p', 'warn', `입원비는 받지 않지만 일주일이 지나가고, 몸이 많이 약해져서 모든 지수가 ${Math.round((1 - SEVERE.keep) * 100)}% 줄어요. 성장 단계가 내려갈 수도 있어요.`));
    const go = el('button', 'btn', '입원시키기');
    go.addEventListener('click', severeStay);
    box.append(go);
  });
}

function severeStay() {
  const pet = S.pet;
  const before = { ...pet.stats };
  const beforeStage = pet.stage;
  STATS.forEach(x => { pet.stats[x.k] = Math.floor(pet.stats[x.k] * SEVERE.keep); });
  pet.sick = null;
  setFatigue(pet, 0);
  const newStage = stageFor(lowest(pet));
  if (newStage < pet.stage) pet.stage = newStage;
  pet.lastLine = '이제 안 아파요... 그래도 아직 기운이 하나도 없어요';
  pet.activities = pet.activities || {};
  pet.activities.severe = (pet.activities.severe || 0) + 1;
  const { festival, news } = advancePeriod();
  const fest = festival || pendingFestival;
  pendingFestival = false;
  save();
  closeModal();
  openModal(box => {
    box.append(el('h3', null, '퇴원했어요'));
    const img = el('img', 'big-sprite');
    img.src = sprite(pet.slug, pet.stage);
    img.alt = '';
    box.append(img, el('p', null, `일주일 동안 입원해서 병은 다 나았지만 몸이 많이 약해졌어요.`));
    box.append(el('p', null, STATS.map(x => `${x.name} ${before[x.k]}→${pet.stats[x.k]}`).join(' · ')));
    if (pet.stage < beforeStage) box.append(el('p', 'warn', `${STAGE_NAMES[beforeStage]}에서 ${STAGE_NAMES[pet.stage]} 모습으로 돌아갔어요.`));
    box.append(el('p', 'next-date', `일주일이 지나 ${dateText(S.calendar)}가 됐어요.`));
    news.forEach(t => box.append(el('p', 'warn', t)));
    const ok = el('button', 'btn', '확인');
    ok.addEventListener('click', () => {
      severeLock = false;
      closeModal();
      showTab('farm');
      if (fest) setTimeout(harvestFestival, 50);
    });
    box.append(ok);
  });
}

function noPointsImg() {
  const img = el('img', 'hosp-txt');
  img.src = HOSP_IMG + 'img_pop13.gif';
  img.alt = '포인트가 모자라서 약을 먹을 수 없어요. 얼른 포인트를 모아 아픈 동물을 꼭 병원에 데려 가세요.';
  return img;
}

function diagnose() {
  const pet = S.pet;
  if (!pet || S.points < HOSPITAL.diagnose) return;
  S.points -= HOSPITAL.diagnose;
  if (pet.sick) pet.sick.known = true;
  save();
  renderPoints();
  openModal(box => {
    box.append(el('h3', null, '진료 결과'));
    const img = el('img', 'big-sprite');
    img.src = sprite(pet.slug, pet.stage);
    img.alt = '';
    box.append(img);
    if (pet.sick) {
      const d = DISEASE_BY_ID[pet.sick.id];
      box.append(el('p', null, `${d.name}(${SEVERITY[pet.sick.sev]})이에요. ${d.symptom}.`));
      box.append(el('p', 'rx', `처방: ${rxText(pet.sick)}${pet.sick.sev >= SEVERE.level ? '' : '. 약국에서 살 수 있어요'}.`));
    } else {
      const f = fatigueNow(pet);
      box.append(el('p', null, f >= FATIGUE.tiredAt
        ? `아픈 곳은 없지만 많이 지쳐 있어요(피로 ${f}). 이대로면 병에 걸리기 쉬우니 푹 쉬게 해주세요.`
        : `아주 건강해요! (피로 ${f})`));
    }
    const row = el('div', 'modal-actions');
    if (pet.sick) {
      const ph = el('button', 'btn', '약국 가기');
      ph.addEventListener('click', () => { closeModal(); hospitalView = 'pharmacy'; renderTown(); });
      row.append(ph);
    }
    const ok = el('button', 'btn ghost', '닫기');
    ok.addEventListener('click', () => { closeModal(); renderTown(); });
    row.append(ok);
    box.append(row);
  });
}

function startSchool(id) {
  const pet = S.pet;
  if (pet.sick) return toast('아픈 동안에는 학교에 갈 수 없어요. 동물병원에 데려가 주세요');
  if (fatigueNow(pet) >= FATIGUE.max) return toast('너무 지쳐서 학교에 갈 수 없어요. 푹 쉬게 해주세요');
  schoolView = id;
  if (id === 'class') {
    const qs = [...QUIZ].sort(() => Math.random() - .5).slice(0, 3)
      .map(([q, ...opts]) => ({ q, answer: opts[0], opts: [...opts].sort(() => Math.random() - .5) }));
    quizState = { qs, i: 0, correct: 0, picked: null };
  }
  if (id === 'paint') {
    const sheets = DRAWINGS.slice().sort(() => Math.random() - .5).slice(0, 3);
    paintState = { choices: sheets, sheet: null, color: PAINT_COLORS[0], fills: 0 };
  }
  renderTown();
  document.querySelector('.app > main').scrollTop = 0;
}

function finishSchool({ title, gain, fatigue, effort, line, decorate, extra }) {
  schoolView = 'hub';
  quizState = paintState = null;
  townView = 'hub';
  endPeriod({ id: 'school', title, cost: SCHOOL_FEE, gain, fatigue, effort, line, decorate, extra });
}

function renderPaint(root) {

  if (!st.sheet) {

    const g = el('div', 'sheet-pick');

    root.append(g);

  }
  const pal = el('div', 'palette');
  PAINT_COLORS.forEach(c => {

    b.style.background = c;
    b.setAttribute('aria-label', `색 ${c}`);

    b.addEventListener('click', () => {

    });
    pal.append(b);
  });
  const canvas = el('canvas', 'paint-canvas');
  canvas.width = 360;
  canvas.height = 570;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const img = new Image();
  img.onload = () => {
    if (st.saved) ctx.putImageData(st.saved, 0, 0);
    else { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 360, 570); ctx.drawImage(img, 0, 0); }
  };
  img.src = st.sheet;
  canvas.addEventListener('pointerdown', e => {
    const r = canvas.getBoundingClientRect();
    const x = Math.floor((e.clientX - r.left) / r.width * 360);
    const y = Math.floor((e.clientY - r.top) / r.height * 570);
    if (floodFill(ctx, x, y, st.color)) {
      st.fills += 1;
      st.saved = ctx.getImageData(0, 0, 360, 570);
    }
  });
  root.append(el('p', 'note', '색을 고르고 칠하고 싶은 곳을 눌러요.'), pal, canvas);
  const done = el('button', 'cook-btn', '다 칠했어요');
  done.addEventListener('click', () => {
    if (st.fills < 3) return toast('조금 더 칠해 주세요');
    const thumb = document.createElement('canvas');
    thumb.width = 120;
    thumb.height = 190;
    thumb.getContext('2d').drawImage(canvas, 0, 0, 120, 190);
    const data = thumb.toDataURL('image/jpeg', 0.8);
    S.drawings = [data, ...(S.drawings || [])].slice(0, 12);
    const bonus = Math.min(10, Math.floor(st.fills / 3));
    finishSchool({
      title: '색칠 완성!', gain: { charm: 20 + bonus, know: 5 }, fatigue: 10, effort: 2,
      line: '제가 칠한 그림 예쁘죠?',
      decorate: box => { const im = el('img', 'paint-result'); im.src = data; im.alt = '색칠한 그림'; box.append(im); },
      extra: ['그림은 동물학교 그림 모음에 걸어 둘게요.'],
    });
  });
  root.append(done);
}

function floodFill(ctx, x, y, hex) {
  const W = 360, H = 570;
  if (x < 0 || y < 0 || x >= W || y >= H) return false;
  const im = ctx.getImageData(0, 0, W, H);
  const d = im.data;
  const i0 = (y * W + x) * 4;
  const sr = d[i0], sg = d[i0 + 1], sb = d[i0 + 2];
  if (sr + sg + sb < 330) return false; // 선 위를 누름
  const fr = parseInt(hex.slice(1, 3), 16), fg = parseInt(hex.slice(3, 5), 16), fb = parseInt(hex.slice(5, 7), 16);
  if (Math.abs(sr - fr) + Math.abs(sg - fg) + Math.abs(sb - fb) < 10) return false;
  const match = i => d[i] + d[i + 1] + d[i + 2] >= 330 && Math.abs(d[i] - sr) + Math.abs(d[i + 1] - sg) + Math.abs(d[i + 2] - sb) < 90;
  const stack = [[x, y]];
  const seen = new Uint8Array(W * H);
  while (stack.length) {
    const [cx, cy] = stack.pop();
    let lx = cx;
    while (lx > 0 && !seen[cy * W + lx - 1] && match((cy * W + lx - 1) * 4)) lx--;
    let rx = cx;
    while (rx < W - 1 && !seen[cy * W + rx + 1] && match((cy * W + rx + 1) * 4)) rx++;
    for (let px = lx; px <= rx; px++) {
      const k = cy * W + px;
      seen[k] = 1;
      d[k * 4] = fr; d[k * 4 + 1] = fg; d[k * 4 + 2] = fb; d[k * 4 + 3] = 255;
      for (const ny of [cy - 1, cy + 1]) {
        if (ny < 0 || ny >= H) continue;
        const nk = ny * W + px;
        if (!seen[nk] && match(nk * 4)) stack.push([px, ny]);
      }
    }
  }
  ctx.putImageData(im, 0, 0);
  return true;
}

function renderTalk(root) {
  const pet = S.pet;
  root.append(el('h2', 'section-title', '말 가르치기'));
  root.append(el('p', 'note', `이렇게 말하면, 이렇게 대답하도록 가르쳐요. 가르친 말은 키우기의 '동물과 대화하기'에서 써요.`));

  q.setAttribute('aria-label', '이렇게 말하면');

  a.placeholder = '이렇게 대답해요 (예: 좋은 꿈 꿔요!)';
